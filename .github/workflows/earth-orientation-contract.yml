name: Earth Orientation Contract

on:
  push:
  pull_request:

jobs:
  earth-orientation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Validate UT1 earth orientation contract
        run: python tools/time/validate_earth_orientation_contract.py
      - name: Test EOP contracts
        run: flutter test test/calculation_core/earth_orientation_test.dart test/calculation_core/bundled_earth_orientation_test.dart
