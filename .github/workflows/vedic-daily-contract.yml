name: Vedic Daily Contract

on:
  push:
    paths:
      - 'lib/src/calculation_core/vedic/**'
      - 'lib/src/calculation_core/daily/vedic_indicator_factor.dart'
      - 'test/calculation_core/vedic_*'
      - 'requirements/reference_manifests/vedic_daily_runtime.json'
      - 'tools/astronomy/validate_vedic_daily_contract.py'
      - '.github/workflows/vedic-daily-contract.yml'
  pull_request:
    paths:
      - 'lib/src/calculation_core/vedic/**'
      - 'lib/src/calculation_core/daily/vedic_indicator_factor.dart'
      - 'test/calculation_core/vedic_*'
      - 'requirements/reference_manifests/vedic_daily_runtime.json'
      - 'tools/astronomy/validate_vedic_daily_contract.py'
      - '.github/workflows/vedic-daily-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/astronomy/validate_vedic_daily_contract.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test test/calculation_core/vedic_daily_indicators_test.dart test/calculation_core/vedic_indicator_daily_factor_test.dart
