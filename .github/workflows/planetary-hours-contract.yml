name: Planetary Hours Contract

on:
  push:
  pull_request:

jobs:
  planetary-hours-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate planetary hours contract
        run: python tools/astronomy/validate_planetary_hours_contract.py
