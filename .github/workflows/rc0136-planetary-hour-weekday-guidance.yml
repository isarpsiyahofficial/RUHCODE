name: RC-0136 Planetary Hour Weekday Guidance

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/planetary_hours/planetary_hour_guidance.dart'
      - 'test/calculation_core/planetary_hour_weekday_guidance_test.dart'
      - 'requirements/contracts/rc0136_planetary_hour_weekday_guidance_contract.json'
      - 'tools/requirements/validate_rc0136_planetary_hour_weekday_guidance.py'
      - '.github/workflows/rc0136-planetary-hour-weekday-guidance.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0136_planetary_hour_weekday_guidance.py
      - run: flutter test test/calculation_core/planetary_hour_weekday_guidance_test.dart
      - name: Promote RC-0136 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0136_planetary_hour_weekday_guidance.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8', newline='') as f:
            rows = list(csv.DictReader(f))
          fields = list(rows[0].keys())
          target = 'RC-0136'
          links = 'requirements/contracts/rc0136_planetary_hour_weekday_guidance_contract.json|tools/requirements/validate_rc0136_planetary_hour_weekday_guidance.py|lib/src/calculation_core/planetary_hours/planetary_hour_guidance.dart|test/calculation_core/planetary_hour_weekday_guidance_test.dart|.github/workflows/rc0136-planetary-hour-weekday-guidance.yml'
          found = False
          for r in rows:
            if r['rc_id'] != target:
              continue
            found = True
            if r['status'] not in ('VERIFIED', 'DONE'):
              r['status'] = 'TESTED'
            r['evidence_links'] = links
            r['blocked'] = 'YES'
            r['blocker'] = 'Authoritative source-tagged TR/EN weekday x planet editorial catalog, RC-0124..RC-0126 exact AKILES provenance/goldens, rendered Free/PRO UI and device/release evidence remain required.'
            r['notes'] = 'Machine gate proves complete 7x7 weekday/planet coverage and rejects a single identical interpretation reused across all seven weekdays for any planet. Fixture strings are not authoritative content. TESTED only.'
          if not found:
            raise SystemExit('RC0136_FAIL: missing matrix row')
          with p.open('w', encoding='utf-8', newline='') as f:
            w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
            w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0136): record weekday guidance TESTED'
          git push origin HEAD:main
