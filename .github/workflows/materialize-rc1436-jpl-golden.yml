name: Materialize RC-1436 JPL Golden

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-rc1436-jpl-golden.yml'
      - 'tools/data/materialize_jpl_horizons_golden.py'
      - 'tools/data/materialize_jpl_horizons_coverage.py'
      - 'tools/data/materialize_de440s_spice_oracle.py'
      - 'test/calculation_core/de440s_jpl_horizons_accuracy_test.dart'
      - 'test/calculation_core/de440s_jpl_horizons_coverage_test.dart'
      - 'test/calculation_core/de440s_naif_spice_oracle_test.dart'
      - 'lib/src/calculation_core/ephemeris/**'
      - 'assets/data/ephemeris/**'

permissions:
  contents: write

concurrency:
  group: materialize-rc1436-jpl-golden-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent NAIF SPICE reader
        run: python -m pip install --disable-pip-version-check 'spiceypy==6.0.0'
      - name: Capture official NASA/JPL Horizons Earth/SSB J2000 vector
        run: python tools/data/materialize_jpl_horizons_golden.py
      - name: Capture official NASA/JPL Horizons multi-epoch coverage
        run: python tools/data/materialize_jpl_horizons_coverage.py
      - name: Capture independent NAIF SPICE states from exact packaged DE440s
        run: python tools/data/materialize_de440s_spice_oracle.py
      - name: Validate evidence provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          single=Path('evidence/rc1436/jpl_horizons_earth_ssb_j2000.json')
          coverage=Path('evidence/rc1436/jpl_horizons_de440s_coverage.json')
          oracle=Path('evidence/rc1436/de440s_naif_spice_oracle.json')
          s=json.loads(single.read_text()); c=json.loads(coverage.read_text()); o=json.loads(oracle.read_text())
          assert s['status']=='OFFICIAL_GOLDEN_CAPTURED' and s['source']['provider']=='NASA/JPL Horizons API'
          assert c['status']=='OFFICIAL_GOLDEN_COVERAGE_CAPTURED' and c['provider']=='NASA/JPL Horizons API'
          assert len(c['vectors'])>=5 and {399,10,301}.issubset({x['targetNaifId'] for x in c['vectors']})
          assert o['status']=='INDEPENDENT_DE440S_ORACLE_CAPTURED' and o['provider']=='NAIF CSPICE via SpiceyPy'
          assert len(o['vectors'])>=5 and {399,10,301}.issubset({x['targetNaifId'] for x in o['vectors']})
          kernel=Path(o['kernel']['path'])
          assert hashlib.sha256(kernel.read_bytes()).hexdigest()==o['kernel']['sha256']
          assert o['kernel']['sizeBytes']==kernel.stat().st_size
          print('Horizons and independent same-kernel SPICE evidence provenance OK')
          PY
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Check official Horizons Earth J2000 cross-source golden
        run: flutter test test/calculation_core/de440s_jpl_horizons_accuracy_test.dart --reporter expanded
      - name: Check explicit DE440s versus Horizons-DE441 cross-model budget
        run: flutter test test/calculation_core/de440s_jpl_horizons_coverage_test.dart --reporter expanded
      - name: Enforce strict same-DE440s accuracy against independent NAIF SPICE
        run: flutter test test/calculation_core/de440s_naif_spice_oracle_test.dart --reporter expanded
      - name: Commit canonical RC-1436 evidence to triggering branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          files=(
            'evidence/rc1436/jpl_horizons_earth_ssb_j2000.json'
            'evidence/rc1436/jpl_horizons_de440s_coverage.json'
            'evidence/rc1436/de440s_naif_spice_oracle.json'
          )
          for evidence in "${files[@]}"; do test -s "$evidence"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          if git diff --cached --quiet -- "${files[@]}"; then
            echo 'Canonical RC-1436 evidence is tracked and unchanged.'
            exit 0
          fi
          git commit -m 'data(rc1436): capture Horizons and independent DE440s oracle evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
