name: RC-0031 RC-0035 Western Placements and Houses

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/western/natal_placements.dart'
      - 'lib/src/calculation_core/western/placidus_houses.dart'
      - 'test/calculation_core/western/natal_placements_test.dart'
      - 'test/calculation_core/western/placidus_houses_test.dart'
      - 'requirements/contracts/rc0031_rc0035_western_placements_contract.json'
      - 'tools/requirements/validate_rc0031_rc0035_western_placements.py'
      - '.github/workflows/rc0031-rc0035-western-placements.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate exact RC-0031..RC-0035 bindings
        run: python tools/requirements/validate_rc0031_rc0035_western_placements.py
      - name: Test natal placements
        run: flutter test test/calculation_core/western/natal_placements_test.dart
      - name: Test twelve calculated houses
        run: flutter test test/calculation_core/western/placidus_houses_test.dart
      - name: Promote proven requirements to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0031_rc0035_western_placements.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8', newline='')))
          fields=list(rows[0].keys())
          promote={f'RC-{i:04d}' for i in range(31,36)}
          links='requirements/contracts/rc0031_rc0035_western_placements_contract.json|tools/requirements/validate_rc0031_rc0035_western_placements.py|lib/src/calculation_core/western/natal_placements.dart|lib/src/calculation_core/western/placidus_houses.dart|test/calculation_core/western/natal_placements_test.dart|test/calculation_core/western/placidus_houses_test.dart|.github/workflows/rc0031-rc0035-western-placements.yml'
          for r in rows:
            if r['rc_id'] not in promote:
              continue
            if r['status'] not in ('VERIFIED','DONE'):
              r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Product/UI visibility plus independent golden and release evidence remains required before VERIFIED/DONE.'
            r['notes']='Exact binding gate validates Western placements/signs/degrees/houses and 12 calculated house cusps with compiled regressions. TESTED only.'
          with p.open('w', encoding='utf-8', newline='') as f:
            w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0031-rc0035): record Western placements TESTED'
          git push origin HEAD:main
