name: RC-0028 System Method Isolation

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/western/**'
      - 'lib/src/calculation_core/vedic/**'
      - 'lib/src/calculation_core/chinese/**'
      - 'lib/src/calculation_core/bazi/**'
      - 'lib/src/calculation_core/numerology/**'
      - 'requirements/contracts/rc0028_system_method_isolation_contract.json'
      - 'tools/requirements/validate_rc0028_system_method_isolation.py'
      - '.github/workflows/rc0028-system-method-isolation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0028 system method isolation
        run: python tools/requirements/validate_rc0028_system_method_isolation.py
      - name: Execute representative independent engine regressions
        run: |
          flutter test test/calculation_core/western/western_astrology_engine_test.dart
          flutter test test/calculation_core/vedic/vedic_astrology_engine_test.dart
          flutter test test/calculation_core/chinese/chinese_astrology_engine_test.dart
          flutter test test/calculation_core/bazi/bazi_engine_test.dart
          flutter test test/calculation_core/numerology/golden_vectors_test.dart
      - name: Promote RC-0028 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0028_system_method_isolation.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0028')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0028_system_method_isolation_contract.json|tools/requirements/validate_rc0028_system_method_isolation.py|lib/src/calculation_core/western/|lib/src/calculation_core/vedic/|lib/src/calculation_core/chinese/|lib/src/calculation_core/bazi/|lib/src/calculation_core/numerology/|.github/workflows/rc0028-system-method-isolation.yml'
          r['notes']='Machine gate proves named system calculation roots cannot import another named system calculation root; representative engine/golden regressions execute separately. Shared neutral core remains allowed. TESTED only.'
          r['blocked']='YES'
          r['blocker']='End-to-end result provenance across all system entry points and later-added calculation systems must be proven before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0028): record system method isolation TESTED'
          git push origin HEAD:main
