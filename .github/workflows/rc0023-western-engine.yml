name: RC-0023 Western Astrology Engine

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/western/western_astrology_engine.dart'
      - 'lib/src/calculation_core/western/natal_chart.dart'
      - 'test/calculation_core/western/western_astrology_engine_test.dart'
      - 'requirements/contracts/rc0023_western_engine_contract.json'
      - 'tools/requirements/validate_rc0023_western_engine.py'
      - '.github/workflows/rc0023-western-engine.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0023 binding and engine boundary
        run: python tools/requirements/validate_rc0023_western_engine.py
      - name: Execute western engine regressions
        run: flutter test test/calculation_core/western/western_astrology_engine_test.dart test/calculation_core/western/natal_chart_test.dart
      - name: Promote RC-0023 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0023_western_engine.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0023')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0023_western_engine_contract.json|tools/requirements/validate_rc0023_western_engine.py|lib/src/calculation_core/western/western_astrology_engine.dart|lib/src/calculation_core/western/natal_chart.dart|test/calculation_core/western/western_astrology_engine_test.dart|test/calculation_core/western/natal_chart_test.dart|.github/workflows/rc0023-western-engine.yml'
          r['notes']='Machine gate proves Batı astrolojisi CalculationEngine sözleşmesini uygulayan ayrı western-astrology motoru üzerinden WesternNatalChart üretir; foreign-engine manifest ve provenance data-version mismatch fail-closed davranır. TESTED only.'
          r['blocked']='YES'
          r['blocker']='End-to-end birth-input→ephemeris→houses→western engine→UI integration and broader golden/release gates remain required before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0023): record western engine TESTED'
          git push origin HEAD:main
