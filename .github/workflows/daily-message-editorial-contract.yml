name: Daily Message Editorial Contract

on:
  push:
    branches: [main]
    paths:
      - 'assets/content/daily_messages/**'
      - 'requirements/content_manifests/daily_messages.json'
      - 'evidence/content/daily_messages_editorial_progress.json'
      - 'tools/content/daily_message_schema.py'
      - 'tools/content/build_daily_message_catalog.py'
      - 'tools/content/append_daily_message_batch.py'
      - 'tools/content/validate_daily_message_catalog.py'
      - 'tools/content/validate_daily_message_contract.py'
      - 'tools/content/validate_daily_message_editorial_progress.py'
      - 'tools/content/validate_daily_message_release_horizon.py'
      - 'tools/content/test_daily_message_schema.py'
      - 'tools/content/test_validate_daily_message_editorial_progress.py'
      - 'tools/content/test_validate_daily_message_release_horizon.py'
      - 'tools/content/test_validate_daily_message_catalog.py'
      - 'tools/content/test_daily_message_shards.py'
      - 'tools/content/test_append_daily_message_batch.py'
      - '.github/workflows/daily-message-editorial-contract.yml'
  pull_request:
    paths:
      - 'assets/content/daily_messages/**'
      - 'requirements/content_manifests/daily_messages.json'
      - 'evidence/content/daily_messages_editorial_progress.json'
      - 'tools/content/daily_message_schema.py'
      - 'tools/content/build_daily_message_catalog.py'
      - 'tools/content/append_daily_message_batch.py'
      - 'tools/content/validate_daily_message_catalog.py'
      - 'tools/content/validate_daily_message_contract.py'
      - 'tools/content/validate_daily_message_editorial_progress.py'
      - 'tools/content/validate_daily_message_release_horizon.py'
      - 'tools/content/test_daily_message_schema.py'
      - 'tools/content/test_validate_daily_message_editorial_progress.py'
      - 'tools/content/test_validate_daily_message_release_horizon.py'
      - 'tools/content/test_validate_daily_message_catalog.py'
      - 'tools/content/test_daily_message_shards.py'
      - 'tools/content/test_append_daily_message_batch.py'
      - '.github/workflows/daily-message-editorial-contract.yml'

permissions:
  contents: read

jobs:
  daily-message-editorial-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate daily-message structural lifecycle contract
        run: python tools/content/validate_daily_message_contract.py
      - name: Validate committed editorial coverage ledger
        run: python tools/content/validate_daily_message_editorial_progress.py
      - name: Test schema normalization contract
        run: python -m unittest tools/content/test_daily_message_schema.py
      - name: Test editorial progress leap-date enforcement
        run: python -m unittest tools/content/test_validate_daily_message_editorial_progress.py
      - name: Test rolling release-horizon enforcement
        run: python -m unittest tools/content/test_validate_daily_message_release_horizon.py
      - name: Test paired editorial batch appender
        run: python -m unittest tools/content/test_append_daily_message_batch.py
      - name: Test daily-message auditor
        run: python -m unittest tools/content/test_validate_daily_message_catalog.py
      - name: Test sharded editorial pipeline
        run: python -m unittest tools/content/test_daily_message_shards.py
      - name: Compile deterministic complete catalog
        run: >-
          python tools/content/build_daily_message_catalog.py
          --shards-root assets/content/daily_messages
          --manifest requirements/content_manifests/daily_messages.json
          --output build/daily_messages.csv
      - name: Strict audit complete editorial release catalog
        run: >-
          python tools/content/validate_daily_message_catalog.py
          --catalog build/daily_messages.csv
          --manifest requirements/content_manifests/daily_messages.json
          --report build/daily_messages_editorial_report.json
      - name: Enforce rolling ten-full-year release stock
        run: >-
          python tools/content/validate_daily_message_release_horizon.py
          --catalog build/daily_messages.csv
          --manifest requirements/content_manifests/daily_messages.json
          --release-date "$(date -u +%F)"
          --report build/daily_messages_release_horizon_report.json
      - name: Upload strict editorial audit
        uses: actions/upload-artifact@v4
        with:
          name: ruh-code-daily-message-editorial-audit
          path: |
            build/daily_messages_editorial_report.json
            build/daily_messages_release_horizon_report.json
          if-no-files-found: error
          retention-days: 30
