name: RC1237-RC1248 Portable Backup

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'lib/src/backup/backup_portability_policy.dart'
      - 'test/backup/backup_portability_rc1237_rc1248_test.dart'
      - 'docs/backup/portable-backup-format-v1.md'
      - 'requirements/contracts/rc1237_rc1248_portable_backup_contract.json'
      - 'tools/requirements/validate_rc1237_rc1248_portable_backup.py'
      - '.github/workflows/rc1237-rc1248-portable-backup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc1237-rc1248-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate exact requirement contract
        run: python tools/requirements/validate_rc1237_rc1248_portable_backup.py
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - name: Portable backup regression
        run: flutter test test/backup/backup_portability_rc1237_rc1248_test.dart
      - name: Keep upstream cache/deletion gates green
        run: |
          python tools/requirements/validate_rc1222_rc1236_calculation_cache.py
          flutter test test/calculation_core/calculation_cache_rc1222_rc1236_test.dart
          python tools/requirements/validate_rc1197_rc1205_data_deletion.py
          flutter test test/data/data_deletion_rc1197_rc1205_test.dart

  record-implementation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote only to IMPLEMENTED + blocked
        shell: bash
        run: |
          set -euo pipefail
          python tools/requirements/validate_rc1237_rc1248_portable_backup.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(1237,1249)}
          links='lib/src/backup/backup_portability_policy.dart|test/backup/backup_portability_rc1237_rc1248_test.dart|docs/backup/portable-backup-format-v1.md|requirements/contracts/rc1237_rc1248_portable_backup_contract.json|tools/requirements/validate_rc1237_rc1248_portable_backup.py|.github/workflows/rc1237-rc1248-portable-backup.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Production archive writer/reader asset placement, preset UI persistence, real clean-install asset round-trip and exact release proof remain required before VERIFIED/DONE.'
            r['notes']='Portable preset/orb/template payloads, external asset references, severity rules and documented machine-readable package layout have dedicated regression coverage.'
          missing=targets-found
          if missing: raise SystemExit(f'RC1237_RC1248_FAIL missing rows: {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc1237-rc1248): record portable backup IMPLEMENTED'
          git push origin HEAD:main
