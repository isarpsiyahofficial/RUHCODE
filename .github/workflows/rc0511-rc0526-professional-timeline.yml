name: RC-0511 through RC-0526 Professional Timeline
on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/professional/timeline_workspace.dart'
      - 'test/professional/timeline_workspace_rc0511_rc0526_test.dart'
      - 'requirements/contracts/rc0511_rc0526_timeline_contract.json'
      - 'tools/requirements/validate_rc0511_rc0526_timeline.py'
      - '.github/workflows/rc0511-rc0526-professional-timeline.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: requirement-matrix-writers-rc0511-rc0526
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0511_rc0526_timeline.py
      - run: flutter test test/professional/timeline_workspace_rc0511_rc0526_test.dart
      - name: Record implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0511_rc0526_timeline.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); targets={f'RC-{i:04d}' for i in range(511,527)}
          links='requirements/contracts/rc0511_rc0526_timeline_contract.json|tools/requirements/validate_rc0511_rc0526_timeline.py|lib/src/professional/timeline_workspace.dart|test/professional/timeline_workspace_rc0511_rc0526_test.dart|.github/workflows/rc0511-rc0526-professional-timeline.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links; r['blocked']='YES'
            r['blocker']='Timeline domain is compiled, but production timed-hit astronomy/reference corpus, rendered TR/EN UI, preset persistence, performance/device/accessibility and exact-release evidence remain.'
            r['notes']='Future timeline windows, high-importance/Saturn/relationship/career filters, non-deterministic-prediction disclosure and reusable consultation presets are implemented.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0511_RC0526_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0511-rc0526): record professional timeline IMPLEMENTED'
          git push origin HEAD:main
