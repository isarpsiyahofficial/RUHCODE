name: Flutter Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-diagnostics
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 7
