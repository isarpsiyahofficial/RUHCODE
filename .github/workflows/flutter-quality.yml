name: Flutter Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
      - name: Surface Flutter test diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('flutter-test.log')
          if not path.exists():
              print('::error title=Flutter test diagnostics::flutter-test.log was not produced')
              raise SystemExit(0)

          lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
          needles = re.compile(
              r'(FAILED|Test failed|EXCEPTION CAUGHT|Expected:|Actual:|Which:|Error:|Exception:|Failure|\[E\])',
              re.IGNORECASE,
          )
          hits = [i for i, line in enumerate(lines) if needles.search(line)]
          emitted = set()
          blocks = []
          for i in hits[:20]:
              start = max(0, i - 3)
              end = min(len(lines), i + 6)
              block = '\n'.join(lines[start:end]).strip()
              if block and block not in emitted:
                  emitted.add(block)
                  blocks.append(block)
          if not blocks:
              blocks = ['\n'.join(lines[-120:]).strip() or 'flutter test failed without textual output']
          for idx, block in enumerate(blocks[:10], start=1):
              escaped = block.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Flutter test failure {idx}::{escaped}')
          PY
      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-diagnostics
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 7
