name: RC-0224 through RC-0229 Spiritual Journal

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/application/spiritual/spiritual_journal_core.dart'
      - 'test/application/spiritual_journal_core_rc0224_rc0229_test.dart'
      - 'requirements/contracts/rc0224_rc0229_spiritual_journal_contract.json'
      - 'tools/requirements/validate_rc0224_rc0229_spiritual_journal.py'
      - '.github/workflows/rc0224-rc0229-spiritual-journal.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0224-rc0229
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0224_rc0229_spiritual_journal.py
      - run: flutter test test/application/spiritual_journal_core_rc0224_rc0229_test.dart
      - name: Promote RC-0224 through RC-0229 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0224_rc0229_spiritual_journal.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(224,230)}
          links='requirements/contracts/rc0224_rc0229_spiritual_journal_contract.json|tools/requirements/validate_rc0224_rc0229_spiritual_journal.py|lib/src/application/spiritual/spiritual_journal_core.dart|test/application/spiritual_journal_core_rc0224_rc0229_test.dart|.github/workflows/rc0224-rc0229-spiritual-journal.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Persistent offline repository wiring, rendered TR/EN journal UI, backup/restore/export coverage, privacy/security/accessibility, reviewed ritual content if shipped, device and exact release artifact gates remain required.'
            r['notes']='Machine gate proves journal record/date identity, dream date filtering, chakra/affirmation/gratitude/ritual boundaries, invalid-date and duplicate-record rejection. TESTED is not VERIFIED/DONE.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0224_RC0229_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0224-rc0229): record spiritual journal TESTED'
          git push origin HEAD:main
