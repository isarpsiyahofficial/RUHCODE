name: RC-0014 Physical Body Positions

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/ephemeris/**'
      - 'test/calculation_core/de440s_ephemeris_provider_test.dart'
      - 'test/calculation_core/de440s_jpl_horizons_accuracy_test.dart'
      - 'requirements/contracts/rc0014_physical_body_positions_contract.json'
      - 'tools/requirements/validate_rc0014_physical_body_positions.py'
      - '.github/workflows/rc0014-physical-body-positions.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0014 binding and provider
        run: python tools/requirements/validate_rc0014_physical_body_positions.py
      - name: Execute packaged body positions and independent kernel golden
        run: flutter test test/calculation_core/de440s_ephemeris_provider_test.dart test/calculation_core/de440s_jpl_horizons_accuracy_test.dart
      - name: Promote RC-0014 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0014_physical_body_positions.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0014')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0014_physical_body_positions_contract.json|tools/requirements/validate_rc0014_physical_body_positions.py|lib/src/calculation_core/ephemeris/de440s_ephemeris_provider.dart|lib/src/calculation_core/ephemeris/spk_body_graph_evaluator.dart|test/calculation_core/de440s_ephemeris_provider_test.dart|test/calculation_core/de440s_jpl_horizons_accuracy_test.dart|.github/workflows/rc0014-physical-body-positions.yml'
          r['notes']='Machine gate executes all ten RC-0014 physical bodies through the packaged DE440s provider, producing finite geocentric J2000-ecliptic position, distance and physical longitude velocity. Independent Earth/SSB JPL kernel golden also remains in the gate. This proves RC-0014 to TESTED only.'
          r['blocked']='YES'
          r['blocker']='Independent official multi-body JPL/Horizons longitude/latitude golden coverage and later release accuracy gates remain required before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0014): record physical body positions TESTED'
          git push origin HEAD:main
