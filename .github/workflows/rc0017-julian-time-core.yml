name: RC-0017 Julian Time Core

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/time/julian_day.dart'
      - 'test/calculation_core/julian_day_test.dart'
      - 'requirements/reference_sources/julian_day.json'
      - 'tools/time/validate_julian_day_contract.py'
      - 'requirements/contracts/rc0017_julian_time_core_contract.json'
      - 'tools/requirements/validate_rc0017_julian_time_core.py'
      - '.github/workflows/rc0017-julian-time-core.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate existing USNO Julian reference contract
        run: python tools/time/validate_julian_day_contract.py
      - name: Validate RC-0017 binding
        run: python tools/requirements/validate_rc0017_julian_time_core.py
      - name: Run compiled Julian Day regressions
        run: flutter test test/calculation_core/julian_day_test.dart
      - name: Promote RC-0017 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/time/validate_julian_day_contract.py
          python tools/requirements/validate_rc0017_julian_time_core.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8', newline='')))
          fields=rows[0].keys()
          target=None
          for r in rows:
              if r['rc_id']=='RC-0017':
                  target=r; break
          if target is None:
              raise SystemExit('missing RC-0017')
          if target['status'] not in ('VERIFIED','DONE'):
              target['status']='TESTED'
          target['evidence_links']='requirements/contracts/rc0017_julian_time_core_contract.json|tools/requirements/validate_rc0017_julian_time_core.py|lib/src/calculation_core/time/julian_day.dart|test/calculation_core/julian_day_test.dart|requirements/reference_sources/julian_day.json|tools/time/validate_julian_day_contract.py|.github/workflows/rc0017-julian-time-core.yml'
          target['notes']='Machine gate proves central Julian Day/MJD/J2000 conversion code against USNO/J2000 reference regressions. Broader astronomical timescale/release evidence remains required before VERIFIED/DONE.'
          target['blocked']='YES'
          target['blocker']='Broader astronomical timescale accuracy/release evidence required by later requirements remains open.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0017): record Julian time core TESTED'
          git push origin HEAD:main
