name: RC-0212 through RC-0223 Spiritual Tools

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/application/spiritual/spiritual_tools_core.dart'
      - 'test/application/spiritual_tools_core_rc0212_rc0223_test.dart'
      - 'requirements/contracts/rc0212_rc0223_spiritual_tools_contract.json'
      - 'tools/requirements/validate_rc0212_rc0223_spiritual_tools.py'
      - '.github/workflows/rc0212-rc0223-spiritual-tools.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0212-rc0223
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0212_rc0223_spiritual_tools.py
      - run: flutter test test/application/spiritual_tools_core_rc0212_rc0223_test.dart
      - name: Promote RC-0212 through RC-0223 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0212_rc0223_spiritual_tools.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(212,224)}
          links='requirements/contracts/rc0212_rc0223_spiritual_tools_contract.json|tools/requirements/validate_rc0212_rc0223_spiritual_tools.py|lib/src/application/spiritual/spiritual_tools_core.dart|test/application/spiritual_tools_core_rc0212_rc0223_test.dart|.github/workflows/rc0212-rc0223-spiritual-tools.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Rendered spiritual-tools UI; authoritative TR/EN Tarot and I Ching editorial/method sources; audited Tarot entropy provider; verified Moon-phase wiring; reviewed meditation/breathwork content; and global accessibility/offline/entitlement/device/release gates remain required.'
            r['notes']='Machine gate proves spiritual-tool taxonomy, deterministic Tarot spread assembly, source/version/editorial provenance, Tarot/I Ching/astronomy boundaries, intention date identity, and meditation/breathwork structural safety. TESTED is not VERIFIED/DONE.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0212_RC0223_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0212-rc0223): record spiritual tools core TESTED'
          git push origin HEAD:main
