name: RC-0030 Western Sun Moon Ascendant

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/western/luminaries_ascendant.dart'
      - 'lib/src/calculation_core/western/natal_placements.dart'
      - 'lib/src/calculation_core/western/equal_house_systems.dart'
      - 'test/calculation_core/western/luminaries_ascendant_test.dart'
      - 'requirements/contracts/rc0030_western_sun_moon_ascendant_contract.json'
      - 'tools/requirements/validate_rc0030_western_sun_moon_ascendant.py'
      - '.github/workflows/rc0030-western-sun-moon-ascendant.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0030 contract
        run: python tools/requirements/validate_rc0030_western_sun_moon_ascendant.py
      - name: Execute RC-0030 compiled regressions
        run: flutter test test/calculation_core/western/luminaries_ascendant_test.dart
      - name: Promote RC-0030 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0030_western_sun_moon_ascendant.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0030')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0030_western_sun_moon_ascendant_contract.json|tools/requirements/validate_rc0030_western_sun_moon_ascendant.py|lib/src/calculation_core/western/luminaries_ascendant.dart|lib/src/calculation_core/western/natal_placements.dart|lib/src/calculation_core/western/equal_house_systems.dart|test/calculation_core/western/luminaries_ascendant_test.dart|.github/workflows/rc0030-western-sun-moon-ascendant.yml'
          r['blocked']='YES'
          r['blocker']='End-to-end birth input through time/location, ephemeris, ASC/houses and Western UI golden evidence remains required before VERIFIED/DONE.'
          r['notes']='Machine gate proves Western Sun and Moon are physical ephemeris placements and Ascendant comes from the calculated house/ASC result, with deterministic tropical sign/degree projection and missing-luminary fail-closed behavior. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0030): record Western Sun Moon Ascendant TESTED'
          git push origin HEAD:main
