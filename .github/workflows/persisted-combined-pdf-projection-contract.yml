name: Persisted Combined PDF Projection Contract

on:
  push:
    paths:
      - 'lib/src/pdf/persisted_combined_pdf_projection.dart'
      - 'lib/src/pdf/pdf_combined_report.dart'
      - 'lib/src/pdf/persisted_calculation_pdf_source.dart'
      - 'lib/src/pdf/persisted_western_natal_pdf.dart'
      - 'lib/src/pdf/persisted_western_natal_sections.dart'
      - 'lib/src/pdf/persisted_pythagorean_numerology_pdf.dart'
      - 'test/pdf/persisted_combined_pdf_projection_test.dart'
      - 'test/pdf/pdf_combined_report_test.dart'
      - 'evidence/pdf/persisted_combined_projection.json'
      - 'tools/pdf/validate_persisted_combined_projection.py'
      - '.github/workflows/persisted-combined-pdf-projection-contract.yml'
  pull_request:
    paths:
      - 'lib/src/pdf/persisted_combined_pdf_projection.dart'
      - 'lib/src/pdf/pdf_combined_report.dart'
      - 'lib/src/pdf/persisted_calculation_pdf_source.dart'
      - 'lib/src/pdf/persisted_western_natal_pdf.dart'
      - 'lib/src/pdf/persisted_western_natal_sections.dart'
      - 'lib/src/pdf/persisted_pythagorean_numerology_pdf.dart'
      - 'test/pdf/persisted_combined_pdf_projection_test.dart'
      - 'test/pdf/pdf_combined_report_test.dart'
      - 'evidence/pdf/persisted_combined_projection.json'
      - 'tools/pdf/validate_persisted_combined_projection.py'
      - '.github/workflows/persisted-combined-pdf-projection-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate persisted combined projection contract
        run: python tools/pdf/validate_persisted_combined_projection.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Persisted combined projection tests
        run: >-
          flutter test
          test/pdf/persisted_combined_pdf_projection_test.dart
          test/pdf/pdf_combined_report_test.dart
