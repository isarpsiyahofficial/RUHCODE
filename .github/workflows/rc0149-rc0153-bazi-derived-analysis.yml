name: RC-0149 through RC-0153 BaZi Derived Analysis

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/bazi/bazi_four_pillars.dart'
      - 'lib/src/calculation_core/bazi/bazi_derived_analysis.dart'
      - 'lib/src/calculation_core/bazi/hidden_stems.dart'
      - 'lib/src/calculation_core/bazi/sexagenary_cycle.dart'
      - 'test/calculation_core/bazi_derived_analysis_test.dart'
      - 'requirements/contracts/rc0149_rc0153_bazi_derived_analysis_contract.json'
      - 'tools/requirements/validate_rc0149_rc0153_bazi_derived_analysis.py'
      - '.github/workflows/rc0149-rc0153-bazi-derived-analysis.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0149-rc0153
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0149_rc0153_bazi_derived_analysis.py
      - run: flutter test test/calculation_core/bazi_derived_analysis_test.dart
      - name: Promote RC-0149 through RC-0153 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0149_rc0153_bazi_derived_analysis.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8', newline='') as f:
            rows = list(csv.DictReader(f))
          fields = list(rows[0].keys())
          targets = {f'RC-{i:04d}' for i in range(149, 154)}
          links = 'requirements/contracts/rc0149_rc0153_bazi_derived_analysis_contract.json|tools/requirements/validate_rc0149_rc0153_bazi_derived_analysis.py|lib/src/calculation_core/bazi/bazi_derived_analysis.dart|lib/src/calculation_core/bazi/hidden_stems.dart|lib/src/calculation_core/bazi/sexagenary_cycle.dart|test/calculation_core/bazi_derived_analysis_test.dart|.github/workflows/rc0149-rc0153-bazi-derived-analysis.yml'
          found = set()
          for r in rows:
            if r['rc_id'] not in targets:
              continue
            found.add(r['rc_id'])
            if r['status'] not in ('VERIFIED', 'DONE'):
              r['status'] = 'TESTED'
            r['evidence_links'] = links
            r['blocked'] = 'YES'
            r['blocker'] = 'Authoritative production BaZi pillar provider/golden vectors and explicit RC-0154 seasonal element-balance methodology, plus rendered TR/EN interpretation, Free/PRO, accessibility, offline/device and release evidence remain required.'
            r['notes'] = 'Machine gate proves reuse of canonical Hidden Stems/Wu Xing primitives, named unweighted occurrence distributions, Day Master identity and deterministic Ten Gods element/polarity relationships. Occurrence counts are not seasonal strength scores; TESTED only.'
          missing = targets - found
          if missing:
            raise SystemExit(f'RC0149_RC0153_FAIL: missing matrix rows: {sorted(missing)}')
          with p.open('w', encoding='utf-8', newline='') as f:
            w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
            w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0149-rc0153): record BaZi derived analysis TESTED'
          git push origin HEAD:main
