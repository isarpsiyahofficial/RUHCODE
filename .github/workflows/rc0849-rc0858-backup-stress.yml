name: RC0849-RC0858 Backup Stress

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/backup/**'
      - 'test/backup/backup_stress_rc0849_rc0858_test.dart'
      - 'test/backup/legacy_backup_v0_migrator_test.dart'
      - 'requirements/contracts/rc0849_rc0858_backup_stress_contract.json'
      - 'tools/requirements/validate_rc0849_rc0858_backup_stress.py'
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - '.github/workflows/rc0849-rc0858-backup-stress.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0849-rc0858
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0849_rc0858_backup_stress.py
      - run: flutter test test/backup/backup_stress_rc0849_rc0858_test.dart test/backup/legacy_backup_v0_migrator_test.dart
      - name: Record implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0849_rc0858_backup_stress.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); targets={f'RC-{i:04d}' for i in range(849,859)}
          links='requirements/contracts/rc0849_rc0858_backup_stress_contract.json|tools/requirements/validate_rc0849_rc0858_backup_stress.py|test/backup/backup_stress_rc0849_rc0858_test.dart|test/backup/legacy_backup_v0_migrator_test.dart|.github/workflows/rc0849-rc0858-backup-stress.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links; r['blocked']='YES'
            r['blocker']='Exact-release clean-install round-trip and physical device persistence/update evidence remain open.'
            r['notes']='4500-record mixed Unicode stress corpus covers TR/EN text, long/quoted notes, emoji, line breaks, same-name records, unknown birth time, plus legacy-schema migration regression.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0849_RC0858_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0849-rc0858): record backup stress IMPLEMENTED'
          git push origin HEAD:main
