name: Time Scales Contract

on:
  push:
  pull_request:

jobs:
  time-scales-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate UTC TAI TT contract
        run: python tools/time/validate_time_scales_contract.py
