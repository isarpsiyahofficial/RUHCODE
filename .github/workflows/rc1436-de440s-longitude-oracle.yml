name: RC1436 DE440s Geocentric Longitude Independent Oracle

on:
  push:
    paths:
      - 'assets/data/ephemeris/**'
      - 'evidence/rc1436/de440s_geocentric_longitude_spice_oracle.json'
      - 'lib/src/calculation_core/ephemeris/**'
      - 'test/calculation_core/de440s_geocentric_longitude_oracle_test.dart'
      - 'tools/data/materialize_de440s_geocentric_longitude_oracle.py'
      - 'tools/data/kernels/naif0012_minimal.tls'
      - 'requirements/reference_manifests/astronomy_accuracy_budgets.json'
      - '.github/workflows/rc1436-de440s-longitude-oracle.yml'
  pull_request:
    paths:
      - 'assets/data/ephemeris/**'
      - 'evidence/rc1436/de440s_geocentric_longitude_spice_oracle.json'
      - 'lib/src/calculation_core/ephemeris/**'
      - 'test/calculation_core/de440s_geocentric_longitude_oracle_test.dart'
      - 'tools/data/materialize_de440s_geocentric_longitude_oracle.py'
      - 'tools/data/kernels/naif0012_minimal.tls'
      - 'requirements/reference_manifests/astronomy_accuracy_budgets.json'
      - '.github/workflows/rc1436-de440s-longitude-oracle.yml'

permissions:
  contents: write

concurrency:
  group: rc1436-de440s-longitude-${{ github.ref }}
  cancel-in-progress: false

jobs:
  de440s-geocentric-longitude-independent-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned independent NAIF SPICE reader
        run: python -m pip install --disable-pip-version-check spiceypy==6.0.0
      - name: Materialize independent geocentric longitude oracle
        run: python tools/data/materialize_de440s_geocentric_longitude_oracle.py
      - name: Validate oracle shape, coverage, kernel provenance and finite longitudes
        run: |
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path

          path = Path('evidence/rc1436/de440s_geocentric_longitude_spice_oracle.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'INDEPENDENT_DE440S_GEOCENTRIC_LONGITUDE_ORACLE_CAPTURED'
          assert data['provider'] == 'NAIF CSPICE via SpiceyPy'
          assert data['oracle']['referenceFrame'] == 'ECLIPJ2000'
          assert data['oracle']['observerNaifId'] == 399
          assert data['oracle']['timeApi'] == 'unitim(JDTDT -> ET)'
          coverage = data['coverage']
          assert coverage == {
              'bodyCount': 10,
              'epochCount': 5,
              'caseCount': 50,
              'firstJdTt': 2415020.5,
              'lastJdTt': 2488069.5,
          }
          kernel = Path(data['kernel']['path'])
          assert kernel.is_file() and kernel.stat().st_size == data['kernel']['sizeBytes']
          assert hashlib.sha256(kernel.read_bytes()).hexdigest() == data['kernel']['sha256']
          time_kernel = Path(data['timeKernel']['path'])
          assert time_kernel.as_posix() == 'tools/data/kernels/naif0012_minimal.tls'
          assert time_kernel.is_file() and time_kernel.stat().st_size >= 500
          assert hashlib.sha256(time_kernel.read_bytes()).hexdigest() == data['timeKernel']['sha256']
          assert data['timeKernel']['source'] == 'NAIF naif0012.tls'
          cases = data['cases']
          assert len(cases) == 50
          assert len({c['id'] for c in cases}) == 50
          assert {c['body'] for c in cases} == {
              'sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto'
          }
          assert {c['jdTt'] for c in cases} == {2415020.5,2451545.0,2461041.5,2469807.5,2488069.5}
          for case in cases:
              lon = case['longitudeDegrees']
              assert isinstance(lon, (int, float)) and math.isfinite(lon) and 0.0 <= lon < 360.0
              assert case['observerNaifId'] == 399
              assert case['referenceFrame'] == 'ECLIPJ2000'
              assert case['corrections'] == 'NONE (geometric)'
          print('Independent DE440s longitude evidence shape/provenance OK')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Enforce RC1436 Sun Moon planet longitude budgets on production runtime
        run: flutter test test/calculation_core/de440s_geocentric_longitude_oracle_test.dart --reporter expanded
      - name: Commit canonical independent longitude evidence to triggering branch
        if: github.event_name == 'push'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          evidence='evidence/rc1436/de440s_geocentric_longitude_spice_oracle.json'
          test -s "$evidence"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$evidence"
          if git diff --cached --quiet -- "$evidence"; then
            echo 'Canonical DE440s longitude evidence is tracked and unchanged.'
            exit 0
          fi
          git commit -m 'data(rc1436): capture independent DE440s longitude evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
