name: RC0942-RC0950 PDF Performance

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/pdf/pdf_generation_performance.dart'
      - 'lib/src/pdf/pdf_output_inspector.dart'
      - 'test/pdf/pdf_generation_performance_rc0942_rc0950_test.dart'
      - 'requirements/contracts/rc0942_rc0950_pdf_performance_contract.json'
      - 'tools/requirements/validate_rc0942_rc0950_pdf_performance.py'
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - '.github/workflows/rc0942-rc0950-pdf-performance.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0942-rc0950
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0942_rc0950_pdf_performance.py
      - run: flutter test test/pdf/pdf_generation_performance_rc0942_rc0950_test.dart
      - name: Record implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0942_rc0950_pdf_performance.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); targets={f'RC-{i:04d}' for i in range(942,951)}
          links='requirements/contracts/rc0942_rc0950_pdf_performance_contract.json|tools/requirements/validate_rc0942_rc0950_pdf_performance.py|lib/src/pdf/pdf_generation_performance.dart|lib/src/pdf/pdf_output_inspector.dart|test/pdf/pdf_generation_performance_rc0942_rc0950_test.dart|.github/workflows/rc0942-rc0950-pdf-performance.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links; r['blocked']='YES'
            r['blocker']='Measured peak-RSS and UI-responsiveness evidence on supported old/mid-range Android devices plus exact-release artifact performance verification remain open.'
            r['notes']='Host regression generates real 5/25/52-page PDFs and a 320-row PDF table; fail-closed completion gate prevents truncated or failed output from being published as success.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0942_RC0950_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0942-rc0950): record PDF performance IMPLEMENTED'
          git push origin HEAD:main
