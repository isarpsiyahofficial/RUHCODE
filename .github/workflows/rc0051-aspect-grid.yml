name: RC-0051 Aspect Grid

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/western/aspect_grid.dart'
      - 'test/calculation_core/western/aspect_grid_test.dart'
      - 'requirements/contracts/rc0051_aspect_grid_contract.json'
      - 'tools/requirements/validate_rc0051_aspect_grid.py'
      - '.github/workflows/rc0051-aspect-grid.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0051_aspect_grid.py
      - run: flutter test test/calculation_core/western/aspect_grid_test.dart
      - name: Promote RC-0051 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0051_aspect_grid.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          r=next(x for x in rows if x['rc_id']=='RC-0051')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0051_aspect_grid_contract.json|tools/requirements/validate_rc0051_aspect_grid.py|lib/src/calculation_core/western/aspect_grid.dart|test/calculation_core/western/aspect_grid_test.dart|.github/workflows/rc0051-aspect-grid.yml'
          r['blocked']='YES'
          r['blocker']='Western UI rendering/accessibility and end-to-end physical chart provenance remain required before VERIFIED/DONE.'
          r['notes']='Exact binding gate proves deterministic square aspect-grid construction, symmetric pair lookup, self-cell handling and provenance fail-closed behavior. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0051): record aspect grid TESTED'
          git push origin HEAD:main
