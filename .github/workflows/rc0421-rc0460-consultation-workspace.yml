name: RC-0421 through RC-0460 Consultation Workspace
on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/professional/consultation_workspace.dart'
      - 'test/professional/consultation_workspace_rc0421_rc0460_test.dart'
      - 'requirements/contracts/rc0421_rc0460_consultation_workspace_contract.json'
      - 'tools/requirements/validate_rc0421_rc0460_consultation_workspace.py'
      - '.github/workflows/rc0421-rc0460-consultation-workspace.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: requirement-matrix-writers-rc0421-rc0460
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0421_rc0460_consultation_workspace.py
      - run: flutter test test/professional/consultation_workspace_rc0421_rc0460_test.dart
      - name: Record implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0421_rc0460_consultation_workspace.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); targets={f'RC-{i:04d}' for i in range(421,461)}
          links='requirements/contracts/rc0421_rc0460_consultation_workspace_contract.json|tools/requirements/validate_rc0421_rc0460_consultation_workspace.py|lib/src/professional/consultation_workspace.dart|test/professional/consultation_workspace_rc0421_rc0460_test.dart|.github/workflows/rc0421-rc0460-consultation-workspace.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links; r['blocked']='YES'
            r['blocker']='Consultation workspace domain is compiled, but persistent client storage, reminder scheduler, verified transit/numerology providers, rendered TR/EN professional UI, security/backup/device and exact-release evidence remain.'
            r['notes']='Shared client workspace, consultation preparation, technical transit evidence, personal notes/templates/search, session history/follow-up and numerology preparation contracts are implemented.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0421_RC0460_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0421-rc0460): record consultation workspace IMPLEMENTED'
          git push origin HEAD:main
