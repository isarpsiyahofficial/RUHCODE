name: RC1304-RC1344 Golden Lifecycle

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'lib/src/lifecycle/golden_lifecycle.dart'
      - 'test/lifecycle/golden_lifecycle_rc1304_rc1344_test.dart'
      - 'requirements/contracts/rc1304_rc1344_golden_lifecycle_contract.json'
      - 'tools/requirements/validate_rc1304_rc1344_golden_lifecycle.py'
      - '.github/workflows/rc1304-rc1344-golden-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc1304-rc1344-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate exact requirement contract
        run: python tools/requirements/validate_rc1304_rc1344_golden_lifecycle.py
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - name: Golden lifecycle gate regression
        run: flutter test test/lifecycle/golden_lifecycle_rc1304_rc1344_test.dart
      - name: Keep upstream entitlement and portable-backup contracts green
        run: |
          python tools/requirements/validate_rc1286_rc1303_entitlement_transfer.py
          python tools/requirements/validate_rc1237_rc1248_portable_backup.py

  record-implementation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote only to IMPLEMENTED + blocked
        shell: bash
        run: |
          set -euo pipefail
          python tools/requirements/validate_rc1304_rc1344_golden_lifecycle.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(1304,1345)}
          links='lib/src/lifecycle/golden_lifecycle.dart|test/lifecycle/golden_lifecycle_rc1304_rc1344_test.dart|requirements/contracts/rc1304_rc1344_golden_lifecycle_contract.json|tools/requirements/validate_rc1304_rc1344_golden_lifecycle.py|.github/workflows/rc1304-rc1344-golden-lifecycle.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Real release-build Golden Lifecycle execution with production persistence/calculation/PDF/backup adapters, TR/EN, Free/PRO, offline/online, clean-install/upgrade and exact artifact evidence remains required before VERIFIED/DONE.'
            r['notes']='Fail-closed module checklist, ordered restore lifecycle, parity checks and full 16-scenario matrix are implemented and regression-gated.'
          missing=targets-found
          if missing: raise SystemExit(f'RC1304_RC1344_FAIL missing rows: {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc1304-rc1344): record golden lifecycle IMPLEMENTED'
          git push origin HEAD:main
