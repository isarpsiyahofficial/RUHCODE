name: RC-0082 RC-0083 Vedic Ayanamsha Selection

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/vedic/ayanamsha_catalog.dart'
      - 'lib/src/calculation_core/vedic/vedic_engine.dart'
      - 'test/calculation_core/vedic/ayanamsha_catalog_test.dart'
      - 'requirements/contracts/rc0082_rc0083_ayanamsha_contract.json'
      - 'tools/requirements/validate_rc0082_rc0083_ayanamsha.py'
      - '.github/workflows/rc0082-rc0083-ayanamsha.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0082_rc0083_ayanamsha.py
      - run: flutter test test/calculation_core/vedic/ayanamsha_catalog_test.dart
      - name: Promote Vedic ayanamsha selection to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0082_rc0083_ayanamsha.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          links='requirements/contracts/rc0082_rc0083_ayanamsha_contract.json|tools/requirements/validate_rc0082_rc0083_ayanamsha.py|lib/src/calculation_core/vedic/ayanamsha_catalog.dart|test/calculation_core/vedic/ayanamsha_catalog_test.dart|.github/workflows/rc0082-rc0083-ayanamsha.yml'
          for r in rows:
            if r['rc_id'] not in ('RC-0082','RC-0083'): continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Independent numerical Lahiri/Chitrapaksha astronomy golden/tolerance evidence, professional settings UI/entitlement evidence, downstream Vedic Lagna/Graha modules and release/device gates remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves Lahiri/Chitrapaksha is the fail-closed default selection and that additional versioned ayanamsha providers can be selected without modifying/coupling the independent Vedic engine. Numerical Lahiri accuracy is intentionally not overclaimed.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0082-rc0083): record Vedic ayanamsha selection TESTED'
          git push origin HEAD:main
