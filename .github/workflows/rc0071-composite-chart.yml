name: RC-0071 Composite Chart

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/western/composite_chart.dart'
      - 'lib/src/calculation_core/western/natal_placements.dart'
      - 'test/calculation_core/western/composite_chart_test.dart'
      - 'requirements/contracts/rc0071_composite_chart_contract.json'
      - 'tools/requirements/validate_rc0071_composite_chart.py'
      - '.github/workflows/rc0071-composite-chart.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0071_composite_chart.py
      - run: flutter test test/calculation_core/western/composite_chart_test.dart
      - name: Promote proven composite core to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0071_composite_chart.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          links='requirements/contracts/rc0071_composite_chart_contract.json|tools/requirements/validate_rc0071_composite_chart.py|lib/src/calculation_core/western/composite_chart.dart|test/calculation_core/western/composite_chart_test.dart|.github/workflows/rc0071-composite-chart.yml'
          for r in rows:
            if r['rc_id'] != 'RC-0071': continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Rendered composite-chart UI, explicit composite house/angle policy, independent astrology review and release/device gates remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves deterministic circular-midpoint composite planetary placements from two independent natal snapshots with preserved TT instants and fail-closed provenance/body-set validation. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0071): record composite chart core TESTED'
          git push origin HEAD:main
