name: RC-0057 RC-0061 House System Catalog

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/western/house_system_catalog.dart'
      - 'lib/src/calculation_core/western/porphyry_houses.dart'
      - 'test/calculation_core/western/house_system_catalog_test.dart'
      - 'requirements/contracts/rc0057_rc0061_house_system_catalog_contract.json'
      - 'tools/requirements/validate_rc0057_rc0061_house_system_catalog.py'
      - '.github/workflows/rc0057-rc0061-house-system-catalog.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

# Retrigger note: previous dedicated run was cancelled before validation completed.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0057_rc0061_house_system_catalog.py
      - run: flutter test test/calculation_core/western/house_system_catalog_test.dart
      - name: Record proven house-system evaluation state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0057_rc0061_house_system_catalog.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          tested={'RC-0057','RC-0058','RC-0059','RC-0060'}
          links='requirements/contracts/rc0057_rc0061_house_system_catalog_contract.json|tools/requirements/validate_rc0057_rc0061_house_system_catalog.py|lib/src/calculation_core/western/house_system_catalog.dart|lib/src/calculation_core/western/porphyry_houses.dart|test/calculation_core/western/house_system_catalog_test.dart|.github/workflows/rc0057-rc0061-house-system-catalog.yml'
          for r in rows:
            if r['rc_id'] in tested:
              if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
              r['evidence_links']=links
              r['blocked']='YES'
              r['blocker']='Independent authoritative algorithm/golden evidence is required before enabling any additional house system or promoting VERIFIED/DONE.'
              r['notes']='Machine gate proves explicit professional evaluation without falsely advertising unvalidated systems; Porphyry has an executable runtime. TESTED only.'
            elif r['rc_id']=='RC-0061':
              if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
              r['evidence_links']=links
              r['blocked']='YES'
              r['blocker']='Product screen integration and widget/device evidence that the active house-system name is actually visible to the user remain required before TESTED/VERIFIED/DONE.'
              r['notes']='TR/EN active-system naming contract exists, but reusable naming logic alone is not counted as user-visible proof.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0057-rc0061): record house-system evaluation state'
          git push origin HEAD:main
