name: PDF Combined Report Contract

on:
  push:
    paths:
      - 'lib/src/pdf/pdf_combined_report.dart'
      - 'test/pdf/pdf_combined_report_test.dart'
      - 'evidence/pdf/combined_report_contract.json'
      - 'tools/pdf/validate_pdf_combined_report.py'
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - '.github/workflows/pdf-combined-report-contract.yml'
  pull_request:
    paths:
      - 'lib/src/pdf/pdf_combined_report.dart'
      - 'test/pdf/pdf_combined_report_test.dart'
      - 'evidence/pdf/combined_report_contract.json'
      - 'tools/pdf/validate_pdf_combined_report.py'
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - '.github/workflows/pdf-combined-report-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: python tools/pdf/validate_pdf_combined_report.py
      - run: flutter pub get
      - run: flutter test test/pdf/pdf_combined_report_test.dart
