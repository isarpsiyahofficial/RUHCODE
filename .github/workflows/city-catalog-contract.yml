name: City Catalog Contract

on:
  push:
  pull_request:

jobs:
  city-catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline city catalog contract
        run: python tools/location/validate_city_catalog_contract.py
      - name: Test deterministic city catalog builder
        run: python tools/location/test_build_city_catalog.py
