name: RC-0230 through RC-0247 Personal Growth

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/application/personal_growth/**'
      - 'test/application/personal_growth/**'
      - 'requirements/contracts/rc0230_rc0247_personal_growth_contract.json'
      - 'tools/requirements/validate_rc0230_rc0247_personal_growth.py'
      - '.github/workflows/rc0230-rc0247-personal-growth.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0230-rc0247
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0230_rc0247_personal_growth.py
      - run: flutter test test/application/personal_growth/personal_growth_core_test.dart
      - name: Promote RC-0230 through RC-0247 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0230_rc0247_personal_growth.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(230,248)}
          links='requirements/contracts/rc0230_rc0247_personal_growth_contract.json|tools/requirements/validate_rc0230_rc0247_personal_growth.py|lib/src/application/personal_growth/personal_growth_core.dart|lib/src/application/personal_growth/symbolic_content_disclosure.dart|test/application/personal_growth/personal_growth_core_test.dart|.github/workflows/rc0230-rc0247-personal-growth.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Rendered TR/EN UI, disclosure-copy review, persistent offline storage, comparison presentation, optional astrology-context product wiring, backup/privacy/accessibility/device and exact-release gates remain required.'
            r['notes']='Machine gate proves standalone personal-growth records, goal subtasks, habits, weekly/monthly reflections, life-wheel/value/mood/check-in/note structures, historical date lookup and optional provenance-tagged astrology context. TESTED is not VERIFIED/DONE.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0230_RC0247_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0230-rc0247): record personal growth TESTED'
          git push origin HEAD:main
