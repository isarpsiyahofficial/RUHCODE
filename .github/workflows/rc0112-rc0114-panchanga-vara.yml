name: RC-0112 RC-0114 Panchanga Vara

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/vedic/vedic_panchanga.dart'
      - 'lib/src/calculation_core/vedic/vedic_vara.dart'
      - 'lib/src/calculation_core/vedic/vedic_panchanga_snapshot.dart'
      - 'test/calculation_core/vedic/vedic_vara_panchanga_snapshot_test.dart'
      - 'requirements/contracts/rc0112_rc0114_panchanga_vara_contract.json'
      - 'tools/requirements/validate_rc0112_rc0114_panchanga_vara.py'
      - '.github/workflows/rc0112-rc0114-panchanga-vara.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0112_rc0114_panchanga_vara.py
      - run: flutter test test/calculation_core/vedic/vedic_vara_panchanga_snapshot_test.dart
      - name: Promote Panchanga Vara architecture to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0112_rc0114_panchanga_vara.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          ids={'RC-0112','RC-0114'}
          links='requirements/contracts/rc0112_rc0114_panchanga_vara_contract.json|tools/requirements/validate_rc0112_rc0114_panchanga_vara.py|lib/src/calculation_core/vedic/vedic_vara.dart|lib/src/calculation_core/vedic/vedic_panchanga_snapshot.dart|test/calculation_core/vedic/vedic_vara_panchanga_snapshot_test.dart|.github/workflows/rc0112-rc0114-panchanga-vara.yml'
          for r in rows:
            if r['rc_id'] not in ids: continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Real AKILES-derived sunrise provider, independent sunrise/Panchanga golden tolerance, TR/EN rendered UI and device/release evidence remain mandatory before VERIFIED/DONE.'
            r['notes']='Machine gate proves sunrise-boundary Vara architecture and five-limb Panchanga assembly without civil-midnight shortcut. TESTED architecture only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0112-rc0114): record Panchanga Vara TESTED'
          git push origin HEAD:main
