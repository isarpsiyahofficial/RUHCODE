name: RC-0342 through RC-0359 UI Profile

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/ui/navigation/information_architecture.dart'
      - 'lib/src/domain/profile/birth_profile.dart'
      - 'test/ui/information_architecture_rc0342_rc0353_test.dart'
      - 'test/domain/birth_profile_rc0354_rc0359_test.dart'
      - 'requirements/contracts/rc0342_rc0359_ui_profile_contract.json'
      - 'tools/requirements/validate_rc0342_rc0359_ui_profile.py'
      - '.github/workflows/rc0342-rc0359-ui-profile.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0342-rc0359
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0342_rc0359_ui_profile.py
      - run: flutter test test/ui/information_architecture_rc0342_rc0353_test.dart test/domain/birth_profile_rc0354_rc0359_test.dart
      - name: Record RC-0342 through RC-0359 implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0342_rc0359_ui_profile.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(342,360)}
          links='requirements/contracts/rc0342_rc0359_ui_profile_contract.json|tools/requirements/validate_rc0342_rc0359_ui_profile.py|lib/src/ui/navigation/information_architecture.dart|lib/src/domain/profile/birth_profile.dart|test/ui/information_architecture_rc0342_rc0353_test.dart|test/domain/birth_profile_rc0354_rc0359_test.dart|.github/workflows/rc0342-rc0359-ui-profile.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Canonical IA and unknown-birth-time profile contracts are compiled, but runtime MainNavigationShell/onboarding/profile editor/real place picker and all time-dependent routes are not yet fully wired and device-verified in TR/EN.'
            r['notes']='Simple/professional IA and fail-closed birth-time semantics are implemented and regression-tested. Do not promote to TESTED/DONE until rendered runtime wiring and time-dependent route audit are complete.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0342_RC0359_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0342-rc0359): record UI profile IMPLEMENTED'
          git push origin HEAD:main
