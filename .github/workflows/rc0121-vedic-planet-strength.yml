name: RC-0121 Vedic Planet Strength Core

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/vedic/vedic_shadbala.dart'
      - 'lib/src/calculation_core/vedic/vedic_planet_strength.dart'
      - 'test/calculation_core/vedic/vedic_planet_strength_test.dart'
      - 'requirements/contracts/rc0121_vedic_planet_strength_contract.json'
      - 'tools/requirements/validate_rc0121_vedic_planet_strength.py'
      - '.github/workflows/rc0121-vedic-planet-strength.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0121_vedic_planet_strength.py
      - run: flutter test test/calculation_core/vedic/vedic_planet_strength_test.dart
      - name: Promote RC-0121 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0121_vedic_planet_strength.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          links='requirements/contracts/rc0121_vedic_planet_strength_contract.json|tools/requirements/validate_rc0121_vedic_planet_strength.py|lib/src/calculation_core/vedic/vedic_planet_strength.dart|test/calculation_core/vedic/vedic_planet_strength_test.dart|.github/workflows/rc0121-vedic-planet-strength.yml'
          for r in rows:
            if r['rc_id'] != 'RC-0121': continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Additional Vedic strength methodologies, independent golden/reference evidence, rendered TR/EN professional UI, entitlement and device/release gates remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves RC-0121 remains separate from Shadbala and exposes only explicit provenance-tagged metrics without hidden weighting. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0121): record Vedic planet-strength core TESTED'
          git push origin HEAD:main
