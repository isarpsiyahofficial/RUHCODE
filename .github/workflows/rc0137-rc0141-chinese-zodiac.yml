name: RC-0137 through RC-0141 Chinese Zodiac

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/chinese/chinese_zodiac.dart'
      - 'test/calculation_core/chinese_zodiac_test.dart'
      - 'requirements/contracts/rc0137_rc0141_chinese_zodiac_contract.json'
      - 'tools/requirements/validate_rc0137_rc0141_chinese_zodiac.py'
      - '.github/workflows/rc0137-rc0141-chinese-zodiac.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0137_rc0141_chinese_zodiac.py
      - run: flutter test test/calculation_core/chinese_zodiac_test.dart
      - name: Promote RC-0137 through RC-0141 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0137_rc0141_chinese_zodiac.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8', newline='') as f:
            rows = list(csv.DictReader(f))
          fields = list(rows[0].keys())
          targets = {f'RC-{i:04d}' for i in range(137, 142)}
          links = 'requirements/contracts/rc0137_rc0141_chinese_zodiac_contract.json|tools/requirements/validate_rc0137_rc0141_chinese_zodiac.py|lib/src/calculation_core/chinese/chinese_zodiac.dart|test/calculation_core/chinese_zodiac_test.dart|.github/workflows/rc0137-rc0141-chinese-zodiac.yml'
          found = set()
          for r in rows:
            if r['rc_id'] not in targets:
              continue
            found.add(r['rc_id'])
            if r['status'] not in ('VERIFIED', 'DONE'):
              r['status'] = 'TESTED'
            r['evidence_links'] = links
            r['blocked'] = 'YES'
            r['blocker'] = 'Production authoritative Chinese-calendar provider with Chinese New Year boundaries and independent golden vectors, rendered TR/EN UI, Free/PRO policy, accessibility, offline/device and release evidence remain required.'
            r['notes'] = 'Machine gate proves canonical 12-animal ordering, cycle-derived zodiac/element/Yin-Yang, explicit source/version provenance and fail-closed Chinese-calendar year-boundary handling. Fixture boundaries are regression evidence only; TESTED only.'
          missing = targets - found
          if missing:
            raise SystemExit(f'RC0137_RC0141_FAIL: missing matrix rows: {sorted(missing)}')
          with p.open('w', encoding='utf-8', newline='') as f:
            w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
            w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0137-rc0141): record Chinese zodiac core TESTED'
          git push origin HEAD:main
