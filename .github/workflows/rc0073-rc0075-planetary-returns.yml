name: RC-0073 RC-0075 Planetary Returns

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/western/planetary_return.dart'
      - 'lib/src/calculation_core/ephemeris/ephemeris.dart'
      - 'test/calculation_core/western/planetary_return_test.dart'
      - 'requirements/contracts/rc0073_rc0075_planetary_returns_contract.json'
      - 'tools/requirements/validate_rc0073_rc0075_planetary_returns.py'
      - '.github/workflows/rc0073-rc0075-planetary-returns.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0073_rc0075_planetary_returns.py
      - run: flutter test test/calculation_core/western/planetary_return_test.dart
      - name: Promote proven return cores to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0073_rc0075_planetary_returns.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          links='requirements/contracts/rc0073_rc0075_planetary_returns_contract.json|tools/requirements/validate_rc0073_rc0075_planetary_returns.py|lib/src/calculation_core/western/planetary_return.dart|test/calculation_core/western/planetary_return_test.dart|.github/workflows/rc0073-rc0075-planetary-returns.yml'
          for r in rows:
            if r['rc_id'] not in ('RC-0073','RC-0074','RC-0075'): continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Rendered return-chart UI, independent astronomy goldens/tolerance review, house-angle integration and release/device gates remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves explicit-TT versioned-ephemeris longitude-return roots with branch-cut protection, provenance checks and fail-closed search windows. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0073-rc0075): record planetary return cores TESTED'
          git push origin HEAD:main
