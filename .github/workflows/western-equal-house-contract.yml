name: Western Equal House Contract

on:
  push:
  pull_request:

jobs:
  western-equal-house-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Western equal-house structural contract
        run: python tools/astronomy/validate_western_equal_house.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test Whole Sign and Equal House boundaries
        run: flutter test test/calculation_core/western/equal_house_systems_test.dart
