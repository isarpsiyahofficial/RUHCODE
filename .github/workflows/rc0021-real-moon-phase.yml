name: RC-0021 Real Moon Phase

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/lunar/moon_phase.dart'
      - 'lib/src/calculation_core/ephemeris/de440s_ephemeris_provider.dart'
      - 'lib/src/calculation_core/ephemeris/de440s_asset_loader.dart'
      - 'test/calculation_core/moon_phase_test.dart'
      - 'test/calculation_core/rc0021_real_moon_phase_test.dart'
      - 'requirements/contracts/rc0021_real_moon_phase_contract.json'
      - 'tools/requirements/validate_rc0021_real_moon_phase.py'
      - '.github/workflows/rc0021-real-moon-phase.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0021 binding and physical phase contract
        run: python tools/requirements/validate_rc0021_real_moon_phase.py
      - name: Execute Moon phase regressions
        run: |
          flutter test test/calculation_core/moon_phase_test.dart
          flutter test test/calculation_core/rc0021_real_moon_phase_test.dart
      - name: Promote RC-0021 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0021_real_moon_phase.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0021')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0021_real_moon_phase_contract.json|tools/requirements/validate_rc0021_real_moon_phase.py|lib/src/calculation_core/lunar/moon_phase.dart|lib/src/calculation_core/ephemeris/de440s_ephemeris_provider.dart|lib/src/calculation_core/ephemeris/de440s_asset_loader.dart|test/calculation_core/moon_phase_test.dart|test/calculation_core/rc0021_real_moon_phase_test.dart|.github/workflows/rc0021-real-moon-phase.yml'
          r['notes']='Machine gate proves Moon phase/illumination are derived from same-instant Sun/Moon astronomical longitude states and compiled against the packaged NASA/JPL DE440s provider. TESTED only.'
          r['blocked']='YES'
          r['blocker']='Independent authoritative multi-epoch lunar phase/illumination golden vectors and end-to-end display integration remain required before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0021): record real Moon phase TESTED'
          git push origin HEAD:main
