name: RC-0008 RC-0010 Time Determinism Contract

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/time/**'
      - 'test/calculation_core/time_zone_runtime_test.dart'
      - 'test/calculation_core/daily_date_context_test.dart'
      - 'requirements/contracts/rc0008_rc0010_time_determinism_contract.json'
      - 'tools/requirements/validate_rc0008_rc0010_time_determinism.py'
      - '.github/workflows/rc0008-rc0010-time-determinism.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Validate static deterministic time contract
        run: python tools/requirements/validate_rc0008_rc0010_time_determinism.py
      - name: Run IANA DST and historical timezone regressions
        run: flutter test test/calculation_core/time_zone_runtime_test.dart test/calculation_core/daily_date_context_test.dart
      - name: Promote RC-0008 RC-0009 RC-0010 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0008_rc0010_time_determinism.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8', newline='')))
          fields=rows[0].keys()
          evidence='requirements/contracts/rc0008_rc0010_time_determinism_contract.json|tools/requirements/validate_rc0008_rc0010_time_determinism.py|lib/src/calculation_core/time/time_zone_runtime.dart|lib/src/calculation_core/time/daily_date_context.dart|test/calculation_core/time_zone_runtime_test.dart|test/calculation_core/daily_date_context_test.dart|.github/workflows/rc0008-rc0010-time-determinism.yml'
          notes={
            'RC-0008':'Machine gate proves calculation-core time/date resolution uses explicit UTC/wall-clock + IANA zone inputs rather than DateTime.now(), with deterministic cache partitioning. End-to-end coordinate/location propagation remains a later integration/release proof.',
            'RC-0009':'Machine gate proves production time runtime initializes bundled IANA tzdb and resolves explicit IANA zone IDs; historical regression tests execute against the packaged timezone database.',
            'RC-0010':'Machine gate proves DST fold/gap policies are explicit and regression-tests historical discontinuities including Pacific/Apia skipped civil day.'
          }
          found=set()
          for r in rows:
              if r['rc_id'] in notes:
                  found.add(r['rc_id'])
                  if r['status'] not in ('VERIFIED','DONE'):
                      r['status']='TESTED'
                  r['evidence_links']=evidence
                  r['notes']=notes[r['rc_id']]
                  if r['rc_id']=='RC-0008':
                      r['blocked']='YES'
                      r['blocker']='End-to-end proof that astronomical calculations consume validated location coordinates together with explicit date/timezone remains required before VERIFIED/DONE.'
                  else:
                      r['blocked']='NO'
                      r['blocker']=''
          missing={'RC-0008','RC-0009','RC-0010'}-found
          if missing:
              raise SystemExit(f'missing requirement rows: {sorted(missing)}')
          with p.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then
            echo 'RC-0008/0009/0010 matrix already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0008-0010): record deterministic time TESTED'
          git push origin HEAD:main
