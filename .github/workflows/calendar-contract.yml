name: Calendar Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calendar-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Gregorian calendar contract
        run: python tools/time/validate_calendar_contract.py
