name: RC-0084 RC-0085 Vedic Lagna and Grahas

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/vedic/vedic_lagna.dart'
      - 'lib/src/calculation_core/vedic/vedic_grahas.dart'
      - 'test/calculation_core/vedic/vedic_lagna_test.dart'
      - 'test/calculation_core/vedic/vedic_grahas_test.dart'
      - 'requirements/contracts/rc0084_rc0085_vedic_lagna_graha_contract.json'
      - 'tools/requirements/validate_rc0084_rc0085_vedic_lagna_grahas.py'
      - '.github/workflows/rc0084-rc0085-vedic-lagna-grahas.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0084_rc0085_vedic_lagna_grahas.py
      - run: flutter test test/calculation_core/vedic/vedic_lagna_test.dart test/calculation_core/vedic/vedic_grahas_test.dart
      - name: Promote Vedic Lagna/Grahas to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0084_rc0085_vedic_lagna_grahas.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          links='requirements/contracts/rc0084_rc0085_vedic_lagna_graha_contract.json|tools/requirements/validate_rc0084_rc0085_vedic_lagna_grahas.py|lib/src/calculation_core/vedic/vedic_lagna.dart|lib/src/calculation_core/vedic/vedic_grahas.dart|test/calculation_core/vedic/vedic_lagna_test.dart|test/calculation_core/vedic/vedic_grahas_test.dart|.github/workflows/rc0084-rc0085-vedic-lagna-grahas.yml'
          for r in rows:
            if r['rc_id'] not in ('RC-0084','RC-0085'): continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Independent astronomy golden/tolerance evidence, numerical Lahiri verification, product UI and release/device gates remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves deterministic Vedic Lagna geometry and complete seven-classical-Graha sidereal placement set with explicit provenance. Rahu/Ketu remain separate RC-0086/RC-0087 requirements.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0084-rc0085): record Vedic Lagna/Grahas TESTED'
          git push origin HEAD:main
