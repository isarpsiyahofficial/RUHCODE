name: RC1436 Placidus Independent Oracle

on:
  push:
  pull_request:

jobs:
  placidus-independent-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned independent oracle
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Preserve committed Placidus evidence
        run: cp evidence/rc1436/placidus_swiss_oracle.json /tmp/placidus_swiss_oracle_expected.json
      - name: Regenerate independent Placidus evidence
        run: python tools/data/materialize_placidus_swiss_oracle.py
      - name: Verify committed evidence is reproducible
        run: python tools/data/verify_placidus_swiss_oracle.py --expected /tmp/placidus_swiss_oracle_expected.json --actual evidence/rc1436/placidus_swiss_oracle.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test production Placidus against canonical budgets
        run: flutter test test/calculation_core/placidus_independent_oracle_test.dart
