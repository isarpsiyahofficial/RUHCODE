name: RC-0015 Lunar Nodes

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/ephemeris/lunar_node_calculator.dart'
      - 'lib/src/calculation_core/ephemeris/de440s_ephemeris_provider.dart'
      - 'test/calculation_core/lunar_node_calculator_test.dart'
      - 'requirements/contracts/rc0015_lunar_nodes_contract.json'
      - 'tools/requirements/validate_rc0015_lunar_nodes.py'
      - '.github/workflows/rc0015-lunar-nodes.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0015 binding and lunar-node contract
        run: python tools/requirements/validate_rc0015_lunar_nodes.py
      - name: Execute deterministic lunar-node regressions
        run: flutter test test/calculation_core/lunar_node_calculator_test.dart
      - name: Promote RC-0015 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0015_lunar_nodes.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0015')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0015_lunar_nodes_contract.json|tools/requirements/validate_rc0015_lunar_nodes.py|lib/src/calculation_core/ephemeris/lunar_node_calculator.dart|lib/src/calculation_core/ephemeris/de440s_ephemeris_provider.dart|test/calculation_core/lunar_node_calculator_test.dart|.github/workflows/rc0015-lunar-nodes.yml'
          r['notes']='Machine gate proves deterministic TT-based mean/true lunar ascending-node calculations, exact opposite descending node, normalization, and fail-closed non-finite inputs while keeping nodes outside physical SPK-body mapping. TESTED only.'
          r['blocked']='YES'
          r['blocker']='Independent authoritative multi-epoch mean/true lunar-node golden vectors, frame/equinox semantics review, and end-to-end integration into every astrology system that consumes nodes remain required before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0015): record lunar nodes TESTED'
          git push origin HEAD:main
