name: Western Natal Placements Contract

on:
  push:
  pull_request:

jobs:
  western-natal-placements-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Western natal placement structural contract
        run: python tools/astronomy/validate_western_natal_placements.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test Western natal placements
        run: flutter test test/calculation_core/western/natal_placements_test.dart
