name: Ephemeris Contract

on:
  push:
  pull_request:

jobs:
  ephemeris-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ephemeris runtime contract
        run: python tools/astronomy/validate_ephemeris_contract.py
