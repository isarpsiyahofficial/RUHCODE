name: RC-0037 House Themes

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/interpretation/western_house_themes.dart'
      - 'test/interpretation/western_house_themes_test.dart'
      - 'requirements/contracts/rc0037_house_themes_contract.json'
      - 'tools/requirements/validate_rc0037_house_themes.py'
      - '.github/workflows/rc0037-house-themes.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0037 contract
        run: python tools/requirements/validate_rc0037_house_themes.py
      - name: Execute bilingual house-theme regressions
        run: flutter test test/interpretation/western_house_themes_test.dart
      - name: Promote RC-0037 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0037_house_themes.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0037')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0037_house_themes_contract.json|tools/requirements/validate_rc0037_house_themes.py|lib/src/interpretation/western_house_themes.dart|test/interpretation/western_house_themes_test.dart|.github/workflows/rc0037-house-themes.yml'
          r['blocked']='YES'
          r['blocker']='Independent bilingual editorial review, final UI rendering, accessibility and exact release-artifact evidence remain required before VERIFIED/DONE.'
          r['notes']='Machine gate proves exactly twelve separately addressable house-theme entries, each with non-empty TR/EN title and description, kept in interpretation rather than calculation_core. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0037): record bilingual house themes TESTED'
          git push origin HEAD:main
