name: RC-1437 Runtime Assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate physical runtime astronomy assets
        run: python tools/requirements/validate_rc1437_runtime_assets.py
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Verify SPK Type-2 evaluator contract
        run: flutter test test/calculation_core/spk_type2_evaluator_test.dart --reporter expanded
      - name: Verify SPK body-center graph contract
        run: flutter test test/calculation_core/spk_body_graph_evaluator_test.dart --reporter expanded
      - name: Evaluate real packaged DE440s Type-2 segment
        run: flutter test test/calculation_core/de440s_type2_runtime_test.dart --reporter expanded
      - name: Resolve real packaged DE440s body graph
        run: flutter test test/calculation_core/de440s_body_graph_runtime_test.dart --reporter expanded
