name: RC-0076 RC-0078 Predictive Techniques

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/western/predictive_techniques.dart'
      - 'lib/src/calculation_core/western/natal_placements.dart'
      - 'lib/src/calculation_core/ephemeris/ephemeris.dart'
      - 'test/calculation_core/western/predictive_techniques_test.dart'
      - 'requirements/contracts/rc0076_rc0078_predictive_techniques_contract.json'
      - 'tools/requirements/validate_rc0076_rc0078_predictive_techniques.py'
      - '.github/workflows/rc0076-rc0078-predictive-techniques.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0076_rc0078_predictive_techniques.py
      - run: flutter test test/calculation_core/western/predictive_techniques_test.dart
      - name: Promote proven predictive cores to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0076_rc0078_predictive_techniques.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          links='requirements/contracts/rc0076_rc0078_predictive_techniques_contract.json|tools/requirements/validate_rc0076_rc0078_predictive_techniques.py|lib/src/calculation_core/western/predictive_techniques.dart|test/calculation_core/western/predictive_techniques_test.dart|.github/workflows/rc0076-rc0078-predictive-techniques.yml'
          for r in rows:
            if r['rc_id'] not in ('RC-0076','RC-0077','RC-0078'): continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Rendered predictive-technique UI, independent astronomy/traditional-method review, house-angle integration where applicable, and release/device gates remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves deterministic day-for-year secondary progressions, progressed-Sun Solar Arc, and modulo-12 annual profections with explicit inputs, provenance checks and fail-closed validation. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0076-rc0078): record predictive technique cores TESTED'
          git push origin HEAD:main
