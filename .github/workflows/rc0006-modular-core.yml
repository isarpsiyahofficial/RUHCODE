name: RC-0006 Modular Core Contract

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/**'
      - 'lib/src/interpretation/**'
      - 'requirements/contracts/rc0006_modular_core_contract.json'
      - 'tools/requirements/validate_rc0006_modular_core.py'
      - '.github/workflows/rc0006-modular-core.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate RC-0006 modular Ruh Code core
        run: python tools/requirements/validate_rc0006_modular_core.py
      - name: Promote RC-0006 to TESTED while preserving provenance blocker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0006_modular_core.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8', newline='')))
          fields=rows[0].keys()
          found=False
          for r in rows:
              if r['rc_id']=='RC-0006':
                  found=True
                  if r['status'] not in ('VERIFIED','DONE'):
                      r['status']='TESTED'
                  r['evidence_links']='requirements/contracts/rc0006_modular_core_contract.json|tools/requirements/validate_rc0006_modular_core.py|lib/src/calculation_core/calculation_engine.dart|lib/src/calculation_core/|lib/src/interpretation/interpretation_engine.dart|.github/workflows/rc0006-modular-core.yml'
                  r['blocked']='YES'
                  r['blocker']='RC-0005 exact AKİLES source/version/hash plus method-level provenance/comparison evidence are required before VERIFIED/DONE.'
                  r['notes']='Machine gate proves the new modular Ruh Code calculation_core boundary, subsystem separation, CalculationEngine abstraction and interpretation separation. It intentionally does not claim AKİLES non-copy/method-transfer provenance without RC-0005 evidence.'
          if not found:
              raise SystemExit('RC-0006 missing from requirement matrix')
          with p.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then
            echo 'RC-0006 matrix already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0006): record modular core TESTED'
          git push origin HEAD:main
