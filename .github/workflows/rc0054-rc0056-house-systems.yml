name: RC-0054 RC-0056 House Systems

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/western/placidus_houses.dart'
      - 'lib/src/calculation_core/western/equal_house_systems.dart'
      - 'test/calculation_core/western/placidus_houses_test.dart'
      - 'test/calculation_core/western/equal_house_systems_test.dart'
      - 'requirements/contracts/rc0054_rc0056_house_systems_contract.json'
      - 'tools/requirements/validate_rc0054_rc0056_house_systems.py'
      - '.github/workflows/rc0054-rc0056-house-systems.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0054_rc0056_house_systems.py
      - run: flutter test test/calculation_core/western/placidus_houses_test.dart
      - run: flutter test test/calculation_core/western/equal_house_systems_test.dart
      - name: Promote proven house systems to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0054_rc0056_house_systems.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          targets={'RC-0054','RC-0055','RC-0056'}
          links='requirements/contracts/rc0054_rc0056_house_systems_contract.json|tools/requirements/validate_rc0054_rc0056_house_systems.py|lib/src/calculation_core/western/placidus_houses.dart|lib/src/calculation_core/western/equal_house_systems.dart|test/calculation_core/western/placidus_houses_test.dart|test/calculation_core/western/equal_house_systems_test.dart|.github/workflows/rc0054-rc0056-house-systems.yml'
          for r in rows:
            if r['rc_id'] not in targets: continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='House-system selection/UI visibility plus independent authoritative goldens and release evidence remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves separate executable Placidus, Whole Sign and Equal House calculation paths with compiled regressions. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0054-rc0056): record house systems TESTED'
          git push origin HEAD:main
