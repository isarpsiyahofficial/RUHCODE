name: RC-0372 through RC-0381 Engagement

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/application/engagement_policy.dart'
      - 'test/application/engagement_policy_rc0372_rc0381_test.dart'
      - 'requirements/contracts/rc0372_rc0381_engagement_contract.json'
      - 'tools/requirements/validate_rc0372_rc0381_engagement.py'
      - '.github/workflows/rc0372-rc0381-engagement.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0372-rc0381
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0372_rc0381_engagement.py
      - run: flutter test test/application/engagement_policy_rc0372_rc0381_test.dart
      - name: Record RC-0372 through RC-0381 implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0372_rc0381_engagement.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(372,382)}
          links='requirements/contracts/rc0372_rc0381_engagement_contract.json|tools/requirements/validate_rc0372_rc0381_engagement.py|lib/src/application/engagement_policy.dart|test/application/engagement_policy_rc0372_rc0381_test.dart|.github/workflows/rc0372-rc0381-engagement.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Monetization/notification policies are compiled, but real ad SDK placement audit, notification scheduler/permissions/channels, verified trigger wiring and Free/PRO device lifecycle evidence remain.'
            r['notes']='Non-interruptive calculation monetization and per-category opt-in notification policies are implemented and regression-tested. Runtime SDK/device integration remains required before TESTED/DONE.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0372_RC0381_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0372-rc0381): record engagement IMPLEMENTED'
          git push origin HEAD:main
