name: RC-0016 Retrograde Motion

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/ephemeris/**'
      - 'test/calculation_core/retrograde_motion_test.dart'
      - 'test/calculation_core/de440s_ephemeris_provider_test.dart'
      - 'requirements/contracts/rc0016_retrograde_motion_contract.json'
      - 'tools/requirements/validate_rc0016_retrograde_motion.py'
      - '.github/workflows/rc0016-retrograde-motion.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0016 binding and motion contract
        run: python tools/requirements/validate_rc0016_retrograde_motion.py
      - name: Execute motion classification and packaged physical-velocity tests
        run: flutter test test/calculation_core/retrograde_motion_test.dart test/calculation_core/de440s_ephemeris_provider_test.dart
      - name: Promote RC-0016 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0016_retrograde_motion.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0016')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0016_retrograde_motion_contract.json|tools/requirements/validate_rc0016_retrograde_motion.py|lib/src/calculation_core/ephemeris/ephemeris.dart|lib/src/calculation_core/ephemeris/de440s_ephemeris_provider.dart|test/calculation_core/retrograde_motion_test.dart|test/calculation_core/de440s_ephemeris_provider_test.dart|.github/workflows/rc0016-retrograde-motion.yml'
          r['notes']='Machine gate proves direct/stationary/retrograde classification is computed from signed finite geocentric ecliptic longitude velocity, including packaged DE440s physical velocity states and explicit fail-closed stationary threshold behavior. TESTED only.'
          r['blocked']='YES'
          r['blocker']='Independent official multi-epoch planetary apparent-motion golden coverage and broader release astronomy accuracy gates remain required before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0016): record retrograde motion TESTED'
          git push origin HEAD:main
