name: Terminology Contract

on:
  push:
    paths:
      - 'lib/src/content/terminology/**'
      - 'test/content/terminology/**'
      - 'evidence/content/terminology_glossary.json'
      - 'tools/content/validate_terminology_glossary.py'
      - '.github/workflows/terminology-contract.yml'
  pull_request:
    paths:
      - 'lib/src/content/terminology/**'
      - 'test/content/terminology/**'
      - 'evidence/content/terminology_glossary.json'
      - 'tools/content/validate_terminology_glossary.py'
      - '.github/workflows/terminology-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural terminology contract
        run: python tools/content/validate_terminology_glossary.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Terminology tests
        run: flutter test test/content/terminology/terminology_glossary_test.dart
