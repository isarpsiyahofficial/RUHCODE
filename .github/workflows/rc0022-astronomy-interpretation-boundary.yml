name: RC-0022 Astronomy Interpretation Boundary

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/**'
      - 'lib/src/interpretation/**'
      - 'requirements/contracts/rc0022_astronomy_interpretation_boundary_contract.json'
      - 'tools/requirements/validate_rc0022_astronomy_interpretation_boundary.py'
      - '.github/workflows/rc0022-astronomy-interpretation-boundary.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate RC-0022 architecture boundary
        run: python tools/requirements/validate_rc0022_astronomy_interpretation_boundary.py
      - name: Promote RC-0022 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0022_astronomy_interpretation_boundary.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0022')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0022_astronomy_interpretation_boundary_contract.json|tools/requirements/validate_rc0022_astronomy_interpretation_boundary.py|lib/src/calculation_core/calculation_engine.dart|lib/src/interpretation/interpretation_engine.dart|.github/workflows/rc0022-astronomy-interpretation-boundary.yml'
          r['notes']='Machine gate scans the complete calculation_core and interpretation Dart trees for forbidden cross-boundary imports and proves separate CalculationEngine/CalculationResult versus snapshot-based InterpretationEngine contracts. TESTED only.'
          r['blocked']='YES'
          r['blocker']='End-to-end feature-level dependency graph and release integration review remain required before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0022): record astronomy interpretation boundary TESTED'
          git push origin HEAD:main
