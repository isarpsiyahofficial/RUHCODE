name: RC0774-RC0848 Portable Backup

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/backup/**'
      - 'test/backup/**'
      - 'requirements/contracts/rc0774_rc0848_portable_backup_contract.json'
      - 'tools/requirements/validate_rc0774_rc0848_portable_backup.py'
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - '.github/workflows/rc0774-rc0848-portable-backup.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0774-rc0848
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0774_rc0848_portable_backup.py
      - run: flutter test test/backup/csv_codec_test.dart test/backup/backup_package_codec_test.dart test/backup/backup_import_coordinator_test.dart test/backup/verified_backup_restore_rc0774_rc0848_test.dart test/backup/backup_full_lifecycle_test.dart
      - name: Record implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0774_rc0848_portable_backup.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); targets={f'RC-{i:04d}' for i in range(774,849)}
          links='requirements/contracts/rc0774_rc0848_portable_backup_contract.json|tools/requirements/validate_rc0774_rc0848_portable_backup.py|lib/src/backup/backup_schema.dart|lib/src/backup/backup_package_codec.dart|lib/src/backup/backup_import_coordinator.dart|lib/src/backup/verified_backup_restore.dart|test/backup/verified_backup_restore_rc0774_rc0848_test.dart|.github/workflows/rc0774-rc0848-portable-backup.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links; r['blocked']='YES'
            r['blocker']='Exact-release clean-install round-trip, device persistence/security and downstream release evidence remain open.'
            r['notes']='Portable relational CSV package, UTF-8/null-safe codec, manifest/checksums, validation/preview, merge/replace, safety snapshot/rollback and post-import integrity rollback are implemented.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0774_RC0848_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0774-rc0848): record portable backup IMPLEMENTED'
          git push origin HEAD:main
