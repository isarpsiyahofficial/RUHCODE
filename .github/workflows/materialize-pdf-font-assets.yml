name: Materialize PDF Font Assets

on:
  push:
    branches:
      - agent/rc1421-rc1442-release-closure
    paths:
      - .github/workflows/materialize-pdf-font-assets.yml
      - tools/pdf/materialize_pdf_font_assets.py
      - lib/src/pdf/pdf_font_release_manifest.dart
      - pubspec.yaml
      - assets/fonts/pdf/PROVENANCE.md
  pull_request:
    paths:
      - .github/workflows/materialize-pdf-font-assets.yml
      - tools/pdf/materialize_pdf_font_assets.py
      - lib/src/pdf/pdf_font_release_manifest.dart
      - pubspec.yaml
      - assets/fonts/pdf/PROVENANCE.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-pdf-font-assets-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', 'feat(pdf): materialize verified Noto Sans assets') }}
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Materialize pinned upstream font assets
        run: python3 tools/pdf/materialize_pdf_font_assets.py

      - name: Verify materialized assets offline
        run: python3 tools/pdf/materialize_pdf_font_assets.py --check

      - name: Verify diff cleanliness
        run: git diff --check

      - name: Print exact verified hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            assets/fonts/pdf/NotoSans-Regular.ttf \
            assets/fonts/pdf/NotoSans-Bold.ttf
          cat assets/fonts/pdf/font_release_provenance.json

      - name: Commit verified release assets
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git add \
            assets/fonts/pdf/NotoSans-Regular.ttf \
            assets/fonts/pdf/NotoSans-Bold.ttf \
            assets/fonts/pdf/OFL.txt \
            assets/fonts/pdf/font_release_provenance.json \
            lib/src/pdf/pdf_font_release_manifest.dart
          if git diff --cached --quiet; then
            echo "Verified PDF font assets already match the pinned release contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(pdf): materialize verified Noto Sans assets"
          git push origin "HEAD:${TARGET_BRANCH}"
