name: Architecture Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase5-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 5 structural architecture
        run: python tools/architecture/validate_phase5_structure.py
