name: RC0933-RC0941 PDF Local Delivery

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/pdf/pdf_local_delivery.dart'
      - 'test/pdf/pdf_local_delivery_rc0933_rc0941_test.dart'
      - 'requirements/contracts/rc0933_rc0941_pdf_local_delivery_contract.json'
      - 'tools/requirements/validate_rc0933_rc0941_pdf_local_delivery.py'
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - '.github/workflows/rc0933-rc0941-pdf-local-delivery.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0933-rc0941
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0933_rc0941_pdf_local_delivery.py
      - run: flutter test test/pdf/pdf_local_delivery_rc0933_rc0941_test.dart
      - name: Record implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0933_rc0941_pdf_local_delivery.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); targets={f'RC-{i:04d}' for i in range(933,942)}
          links='requirements/contracts/rc0933_rc0941_pdf_local_delivery_contract.json|tools/requirements/validate_rc0933_rc0941_pdf_local_delivery.py|lib/src/pdf/pdf_local_delivery.dart|test/pdf/pdf_local_delivery_rc0933_rc0941_test.dart|.github/workflows/rc0933-rc0941-pdf-local-delivery.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links; r['blocked']='YES'
            r['blocker']='Platform share/files adapter, airplane-mode device evidence and exact-release artifact verification remain open.'
            r['notes']='PDF filenames are sanitized and collision-safe; delivery targets are local share/email/messaging/files and core policy requires neither internet nor an owned server.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0933_RC0941_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0933-rc0941): record local PDF delivery IMPLEMENTED'
          git push origin HEAD:main
