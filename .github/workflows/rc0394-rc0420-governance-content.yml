name: RC-0394 through RC-0420 Governance Content

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/application/release_readiness_policy.dart'
      - 'lib/src/content/interpretation_catalog_policy.dart'
      - 'test/application/release_readiness_rc0394_rc0405_test.dart'
      - 'test/content/interpretation_catalog_rc0406_rc0420_test.dart'
      - 'assets/i18n/system_tr.json'
      - 'assets/i18n/system_en.json'
      - 'requirements/contracts/rc0394_rc0420_governance_content_contract.json'
      - 'tools/requirements/validate_rc0394_rc0420_governance_content.py'
      - '.github/workflows/rc0394-rc0420-governance-content.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0394-rc0420
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0394_rc0420_governance_content.py
      - run: flutter test test/application/release_readiness_rc0394_rc0405_test.dart test/content/interpretation_catalog_rc0406_rc0420_test.dart
      - name: Record RC-0394 through RC-0420 implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0394_rc0420_governance_content.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(394,421)}
          links='requirements/contracts/rc0394_rc0420_governance_content_contract.json|tools/requirements/validate_rc0394_rc0420_governance_content.py|lib/src/application/release_readiness_policy.dart|lib/src/content/interpretation_catalog_policy.dart|test/application/release_readiness_rc0394_rc0405_test.dart|test/content/interpretation_catalog_rc0406_rc0420_test.dart|assets/i18n/system_tr.json|assets/i18n/system_en.json|.github/workflows/rc0394-rc0420-governance-content.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Governance/content boundaries are compiled and CI-checked, but exact AKILES regression provenance, production reference/golden evidence, complete runtime TR/EN localization, rendered normal/pro UI and exact-release evidence remain.'
            r['notes']='Release fail-closed policy, TR/EN key parity gate, system-separated interpretation catalogs, exact applicability and normal/detailed/pro presentation contracts are implemented. No TESTED/DONE promotion until production evidence closes blockers.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0394_RC0420_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0394-rc0420): record governance content IMPLEMENTED'
          git push origin HEAD:main
