name: RC-0024 Vedic Astrology Engine

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/vedic/vedic_astrology_engine.dart'
      - 'test/calculation_core/vedic/vedic_astrology_engine_test.dart'
      - 'requirements/contracts/rc0024_vedic_engine_contract.json'
      - 'tools/requirements/validate_rc0024_vedic_engine.py'
      - '.github/workflows/rc0024-vedic-engine.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0024 binding and engine boundary
        run: python tools/requirements/validate_rc0024_vedic_engine.py
      - name: Execute Vedic engine regressions
        run: flutter test test/calculation_core/vedic/vedic_astrology_engine_test.dart
      - name: Promote RC-0024 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0024_vedic_engine.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=rows[0].keys()
          r=next(x for x in rows if x['rc_id']=='RC-0024')
          if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
          r['evidence_links']='requirements/contracts/rc0024_vedic_engine_contract.json|tools/requirements/validate_rc0024_vedic_engine.py|lib/src/calculation_core/vedic/vedic_astrology_engine.dart|test/calculation_core/vedic/vedic_astrology_engine_test.dart|.github/workflows/rc0024-vedic-engine.yml'
          r['notes']='Machine gate proves Vedik astrolojisi ortak CalculationEngine sözleşmesini uygulayan ayrı vedic-astrology motorunda explicit sidereal/ayanamsha manifestiyle deterministic tropical→sidereal placement üretir; foreign manifest, mixed provenance, duplicate body ve invalid ayanamsha fail-closed davranır. TESTED only.'
          r['blocked']='YES'
          r['blocker']='Authoritative ayanamsha calculation/golden vectors, complete Vedic rule coverage and end-to-end birth-input→ephemeris→Vedic engine→UI integration remain required before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0024): record Vedic engine TESTED'
          git push origin HEAD:main
