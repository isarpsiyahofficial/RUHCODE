name: RC-0096 RC-0098 Vedic Saptamsa Dasamsa Dwadasamsa

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/vedic/vedic_varga.dart'
      - 'test/calculation_core/vedic/vedic_varga_test.dart'
      - 'requirements/contracts/rc0096_rc0098_varga_d7_d10_d12_contract.json'
      - 'tools/requirements/validate_rc0096_rc0098_varga_d7_d10_d12.py'
      - '.github/workflows/rc0096-rc0098-varga-d7-d10-d12.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0096_rc0098_varga_d7_d10_d12.py
      - run: flutter test test/calculation_core/vedic/vedic_varga_test.dart
      - name: Promote D7/D10/D12 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0096_rc0098_varga_d7_d10_d12.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8',newline=''))); fields=list(rows[0].keys())
          links='requirements/contracts/rc0096_rc0098_varga_d7_d10_d12_contract.json|tools/requirements/validate_rc0096_rc0098_varga_d7_d10_d12.py|lib/src/calculation_core/vedic/vedic_varga.dart|test/calculation_core/vedic/vedic_varga_test.dart|.github/workflows/rc0096-rc0098-varga-d7-d10-d12.yml'
          for r in rows:
            if r['rc_id'] not in ('RC-0096','RC-0097','RC-0098'): continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links; r['blocked']='YES'
            r['blocker']='Independent Varga golden/reference evidence, D16+ modules, interpretation/editorial data, rendered product UI and device/release gates remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves deterministic classical D7/D10/D12 mapping with provenance and boundary regressions. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0096-rc0098): record D7 D10 D12 TESTED'
          git push origin HEAD:main
