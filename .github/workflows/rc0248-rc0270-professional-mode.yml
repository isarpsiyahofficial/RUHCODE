name: RC-0248 through RC-0270 Professional Mode

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/application/professional/**'
      - 'test/application/professional/**'
      - 'requirements/contracts/rc0248_rc0270_professional_mode_contract.json'
      - 'tools/requirements/validate_rc0248_rc0270_professional_mode.py'
      - '.github/workflows/rc0248-rc0270-professional-mode.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0248-rc0270
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0248_rc0270_professional_mode.py
      - run: flutter test test/application/professional/professional_mode_core_test.dart
      - name: Promote RC-0248 through RC-0270 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0248_rc0270_professional_mode.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(248,271)}
          links='requirements/contracts/rc0248_rc0270_professional_mode_contract.json|tools/requirements/validate_rc0248_rc0270_professional_mode.py|lib/src/application/professional/professional_mode_core.dart|test/application/professional/professional_mode_core_test.dart|.github/workflows/rc0248-rc0270-professional-mode.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Rendered TR/EN simple/professional UI, persistent offline storage, entitlement record limits, verified calculation artifact wiring, professional PDF/device/exact-release gates remain required.'
            r['notes']='Machine gate proves explicit simple/professional separation, PRO professional access, client/profile/note/tag/search/history structures, distinct synastry profile selection, professional calculation settings and non-recomputing professional result-table surfaces. TESTED is not VERIFIED/DONE.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0248_RC0270_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0248-rc0270): record professional mode TESTED'
          git push origin HEAD:main
