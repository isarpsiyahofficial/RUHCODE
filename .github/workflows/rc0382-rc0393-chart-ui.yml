name: RC-0382 through RC-0393 Chart UI

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/ui/chart/chart_readability_policy.dart'
      - 'test/ui/chart_readability_rc0382_rc0393_test.dart'
      - 'requirements/contracts/rc0382_rc0393_chart_ui_contract.json'
      - 'tools/requirements/validate_rc0382_rc0393_chart_ui.py'
      - '.github/workflows/rc0382-rc0393-chart-ui.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0382-rc0393
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0382_rc0393_chart_ui.py
      - run: flutter test test/ui/chart_readability_rc0382_rc0393_test.dart
      - name: Record RC-0382 through RC-0393 implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0382_rc0393_chart_ui.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(382,394)}
          links='requirements/contracts/rc0382_rc0393_chart_ui_contract.json|tools/requirements/validate_rc0382_rc0393_chart_ui.py|lib/src/ui/chart/chart_readability_policy.dart|test/ui/chart_readability_rc0382_rc0393_test.dart|.github/workflows/rc0382-rc0393-chart-ui.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Chart readability policies are compiled, but production chart renderer, professional tables, phone/tablet overlap/readability screenshots, TR/EN accessibility and exact-release/device evidence remain.'
            r['notes']='Professional visual/readability constraints, label deconfliction, aspect density and zoom policy are implemented and regression-tested. Real rendered UI verification is still mandatory.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0382_RC0393_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0382-rc0393): record chart UI IMPLEMENTED'
          git push origin HEAD:main
