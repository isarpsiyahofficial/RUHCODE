name: Julian Day Contract

on:
  push:
  pull_request:

jobs:
  julian-day-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Julian Day reference contract
        run: python tools/time/validate_julian_day_contract.py
