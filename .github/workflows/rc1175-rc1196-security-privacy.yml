name: RC1175-RC1196 Security Privacy

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'lib/src/security/privacy_and_storage_policy.dart'
      - 'test/security/privacy_and_storage_rc1175_rc1196_test.dart'
      - 'requirements/contracts/rc1175_rc1196_security_privacy_contract.json'
      - 'tools/requirements/validate_rc1175_rc1196_security_privacy.py'
      - '.github/workflows/rc1175-rc1196-security-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc1175-rc1196-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate exact requirement contract
        run: python tools/requirements/validate_rc1175_rc1196_security_privacy.py
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - name: Security and privacy regression
        run: flutter test test/security/privacy_and_storage_rc1175_rc1196_test.dart

  record-implementation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote only to IMPLEMENTED + blocked
        shell: bash
        run: |
          set -euo pipefail
          python tools/requirements/validate_rc1175_rc1196_security_privacy.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(1175,1197)}
          links='lib/src/security/privacy_and_storage_policy.dart|test/security/privacy_and_storage_rc1175_rc1196_test.dart|requirements/contracts/rc1175_rc1196_security_privacy_contract.json|tools/requirements/validate_rc1175_rc1196_security_privacy.py|.github/workflows/rc1175-rc1196-security-privacy.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Real secure-storage/keystore/biometric adapters, encrypted database migration, modern platform storage integration, and release-binary log inspection remain required before VERIFIED/DONE.'
            r['notes']='Permission isolation, export privacy, local encryption key-origin, app-lock fallback and PII-safe production logging policies are implemented with regressions.'
          missing=targets-found
          if missing: raise SystemExit(f'RC1175_RC1196_FAIL missing rows: {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc1175-rc1196): record security privacy IMPLEMENTED'
          git push origin HEAD:main
