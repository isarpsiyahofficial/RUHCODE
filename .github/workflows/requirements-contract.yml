name: Requirements Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-requirements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate RC sequence
        run: python tools/requirements/validate_requirements.py
      - name: Validate classification policy
        run: python tools/requirements/classify_requirements.py
      - name: Validate evidence semantic ownership
        run: python tools/requirements/validate_evidence_traceability.py
      - name: Validate persisted Western semantic ownership
        run: python tools/requirements/validate_persisted_western_traceability.py
      - name: Validate Western production write boundary
        run: python tools/astronomy/validate_western_natal_write_boundary.py
      - name: Build traceability matrix
        run: python tools/requirements/build_requirement_matrix.py
      - name: Validate matrix contract
        shell: python
        run: |
          import csv
          from pathlib import Path
          path = Path('requirements/requirement_matrix.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8', newline='')))
          ids = [r['rc_id'] for r in rows]
          expected = [f'RC-{i:04d}' for i in range(1, 1443)]
          assert len(rows) == 1442, len(rows)
          assert ids == expected
          assert len(set(ids)) == 1442
          valid = {'NOT_STARTED','IMPLEMENTED','TESTED','VERIFIED','DONE'}
          allowed_tags = {'CALC','CONTENT','UI','I18N','OFFLINE','ENTITLEMENT','BACKUP','PDF','SECURITY','A11Y','PERF','RELEASE'}
          observed_tags = set()
          for row in rows:
              assert row['status'] in valid, row
              assert row['task_ids'].strip(), row['rc_id']
              assert row['tags'].strip() not in {'', 'UNCLASSIFIED'}, row['rc_id']
              tags = set(row['tags'].split('|'))
              assert tags <= allowed_tags, (row['rc_id'], tags - allowed_tags)
              observed_tags |= tags
              assert row['evidence_required'].strip() not in {'', 'TBD'}, row['rc_id']
              if row['status'] == 'DONE':
                  assert row['evidence_links'].strip(), row['rc_id']
          assert observed_tags == allowed_tags, (observed_tags, allowed_tags - observed_tags)
          print('OK: 1,442-row classified traceability contract validated')
