name: Requirements Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-requirements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate RC sequence
        run: python tools/requirements/validate_requirements.py
      - name: Validate classification policy
        run: python tools/requirements/classify_requirements.py
      - name: Validate all evidence file integrity
        run: python tools/requirements/validate_evidence_integrity.py
      - name: Validate evidence semantic ownership
        run: python tools/requirements/validate_evidence_traceability.py
      - name: Validate exact UI evidence semantic ownership
        run: python tools/requirements/validate_ui_evidence_traceability.py
      - name: Validate exact local PDF evidence semantic ownership
        run: python tools/requirements/validate_pdf_evidence_traceability.py
      - name: Validate PDF report-planning semantic ownership
        run: python tools/pdf/validate_pdf_report_planning_semantics.py
      - name: Validate persisted Western semantic ownership
        run: python tools/requirements/validate_persisted_western_traceability.py
      - name: Validate UI accessibility semantic ownership
        run: python tools/requirements/validate_ui_accessibility_traceability.py
      - name: Validate backup application-service semantic ownership
        run: python tools/requirements/validate_backup_application_traceability.py
      - name: Validate backup transport semantic ownership
        run: python tools/requirements/validate_backup_transport_traceability.py
      - name: Validate single-table CSV semantic ownership
        run: python tools/backup/validate_single_table_csv_export.py
      - name: Validate backup restore preview semantic/action ownership
        run: python tools/backup/validate_backup_restore_preview_accessibility.py
      - name: Validate Western production write boundary
        run: python tools/astronomy/validate_western_natal_write_boundary.py
      - name: Validate UI design tokens and measured contrast
        run: python tools/ui/validate_design_tokens.py
      - name: Validate runtime UI theme token bridge
        run: python tools/ui/validate_runtime_theme_tokens.py
      - name: Validate UI accessibility and interaction contract
        run: python tools/ui/validate_accessibility_interactions.py
      - name: Validate live runtime action coverage
        run: python tools/ui/validate_runtime_action_coverage.py
      - name: Build traceability matrix
        run: python tools/requirements/build_requirement_matrix.py
      - name: Validate matrix contract
        shell: python
        run: |
          import csv
          from pathlib import Path
          path = Path('requirements/requirement_matrix.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8', newline='')))
          ids = [r['rc_id'] for r in rows]
          expected = [f'RC-{i:04d}' for i in range(1, 1443)]
          assert len(rows) == 1442, len(rows)
          assert ids == expected
          assert len(set(ids)) == 1442
          valid = {'NOT_STARTED','IMPLEMENTED','TESTED','VERIFIED','DONE'}
          allowed_tags = {'CALC','CONTENT','UI','I18N','OFFLINE','ENTITLEMENT','BACKUP','PDF','SECURITY','A11Y','PERF','RELEASE'}
          observed_tags = set()
          for row in rows:
              assert row['status'] in valid, row
              assert row['task_ids'].strip(), row['rc_id']
              assert row['tags'].strip() not in {'', 'UNCLASSIFIED'}, row['rc_id']
              tags = set(row['tags'].split('|'))
              assert tags <= allowed_tags, (row['rc_id'], tags - allowed_tags)
              observed_tags |= tags
              assert row['evidence_required'].strip() not in {'', 'TBD'}, row['rc_id']
              if row['status'] in {'IMPLEMENTED','TESTED','VERIFIED','DONE'}:
                  assert row['evidence_links'].strip(), row['rc_id']
              if row['status'] == 'DONE':
                  assert 'SOURCE_LEVEL_IMPLEMENTED evidence' not in row['notes'], row['rc_id']
          assert observed_tags == allowed_tags, (observed_tags, allowed_tags - observed_tags)
          print('OK: 1,442-row classified traceability contract validated with evidence-backed non-default states')
      - name: Upload generated requirement matrix
        uses: actions/upload-artifact@v4
        with:
          name: ruh-code-requirement-matrix
          path: requirements/requirement_matrix.csv
          if-no-files-found: error
          retention-days: 30
