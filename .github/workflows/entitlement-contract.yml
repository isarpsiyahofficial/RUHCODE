name: Feature Entitlement Contract

on:
  push:
    paths:
      - 'lib/src/entitlements/**'
      - 'lib/src/domain/models/core_models.dart'
      - 'test/entitlements/**'
      - 'evidence/entitlements/**'
      - 'tools/entitlements/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/entitlement-contract.yml'
  pull_request:
    paths:
      - 'lib/src/entitlements/**'
      - 'lib/src/domain/models/core_models.dart'
      - 'test/entitlements/**'
      - 'evidence/entitlements/**'
      - 'tools/entitlements/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/entitlement-contract.yml'

jobs:
  entitlement-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate entitlement structural contract
        run: python tools/entitlements/validate_feature_policy_contract.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run entitlement tests
        run: flutter test test/entitlements
