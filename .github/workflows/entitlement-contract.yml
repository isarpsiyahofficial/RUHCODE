name: Feature Entitlement Contract

on:
  push:
    paths:
      - 'lib/src/entitlements/**'
      - 'lib/src/ui/navigation/**'
      - 'lib/src/app/**'
      - 'lib/src/pdf/guarded_pdf_service.dart'
      - 'lib/src/data/local/core_repositories.dart'
      - 'lib/src/domain/models/core_models.dart'
      - 'test/entitlements/**'
      - 'test/ui/main_navigation_entitlement_wiring_test.dart'
      - 'evidence/entitlements/**'
      - 'tools/entitlements/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/entitlement-contract.yml'
  pull_request:
    paths:
      - 'lib/src/entitlements/**'
      - 'lib/src/ui/navigation/**'
      - 'lib/src/app/**'
      - 'lib/src/pdf/guarded_pdf_service.dart'
      - 'lib/src/data/local/core_repositories.dart'
      - 'lib/src/domain/models/core_models.dart'
      - 'test/entitlements/**'
      - 'test/ui/main_navigation_entitlement_wiring_test.dart'
      - 'evidence/entitlements/**'
      - 'tools/entitlements/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/entitlement-contract.yml'

jobs:
  entitlement-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate entitlement structural contract
        run: python tools/entitlements/validate_feature_policy_contract.py
      - name: Validate runtime entitlement composition
        run: python tools/entitlements/validate_runtime_entitlement_composition.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run entitlement unit and integration tests
        run: flutter test test/entitlements
      - name: Run guarded UI route matrix
        run: flutter test test/ui/main_navigation_entitlement_wiring_test.dart
