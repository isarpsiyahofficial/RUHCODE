name: RC-0271 through RC-0305 Report and Entitlement

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/application/product/**'
      - 'test/application/product/**'
      - 'requirements/contracts/rc0271_rc0305_report_entitlement_contract.json'
      - 'tools/requirements/validate_rc0271_rc0305_report_entitlement.py'
      - '.github/workflows/rc0271-rc0305-report-entitlement.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0271-rc0305
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0271_rc0305_report_entitlement.py
      - run: flutter test test/application/product/report_entitlement_core_test.dart
      - name: Promote RC-0271 through RC-0305 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0271_rc0305_report_entitlement.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(271,306)}
          links='requirements/contracts/rc0271_rc0305_report_entitlement_contract.json|tools/requirements/validate_rc0271_rc0305_report_entitlement.py|lib/src/application/product/report_entitlement_core.dart|test/application/product/report_entitlement_core_test.dart|.github/workflows/rc0271-rc0305-report-entitlement.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Real rendered TR/EN PDF artifacts, production Calculation Manifest wiring, real ads/rewarded/PRO entitlement providers, rendered Free/PRO UI, offline/device/accessibility/security/exact-release gates remain required.'
            r['notes']='Machine gate proves PDF/report data is bound to existing calculation result/manifests without report-specific recalculation, single-app Free/PRO feature policy, meaningful Free basics, temporary rewarded daily unlock, ad-free PRO, advanced PRO surface and invariant calculation truth. TESTED is not VERIFIED/DONE.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0271_RC0305_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0271-rc0305): record report entitlement TESTED'
          git push origin HEAD:main
