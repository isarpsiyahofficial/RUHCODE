name: RC-0360 through RC-0371 Storage Runtime

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/data/profile/profile_storage_contract.dart'
      - 'lib/src/application/runtime_capability_policy.dart'
      - 'lib/src/entitlements/feature_access_guard.dart'
      - 'test/data/profile_storage_rc0360_rc0365_test.dart'
      - 'test/application/runtime_capability_rc0366_rc0371_test.dart'
      - 'requirements/contracts/rc0360_rc0371_storage_runtime_contract.json'
      - 'tools/requirements/validate_rc0360_rc0371_storage_runtime.py'
      - '.github/workflows/rc0360-rc0371-storage-runtime.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0360-rc0371
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0360_rc0371_storage_runtime.py
      - run: flutter test test/data/profile_storage_rc0360_rc0365_test.dart test/application/runtime_capability_rc0366_rc0371_test.dart
      - name: Record RC-0360 through RC-0371 implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0360_rc0371_storage_runtime.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(360,372)}
          links='requirements/contracts/rc0360_rc0371_storage_runtime_contract.json|tools/requirements/validate_rc0360_rc0371_storage_runtime.py|lib/src/data/profile/profile_storage_contract.dart|lib/src/application/runtime_capability_policy.dart|lib/src/entitlements/feature_access_guard.dart|test/data/profile_storage_rc0360_rc0365_test.dart|test/application/runtime_capability_rc0366_rc0371_test.dart|.github/workflows/rc0360-rc0371-storage-runtime.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Owner-scoped storage/runtime boundaries are compiled, but production encrypted repository/key management, cloud tenant enforcement, network inventory/airplane-mode evidence and real premium assertion integration are not yet release-verified.'
            r['notes']='Profile tenant isolation and offline/remote service boundaries are implemented and regression-tested. Do not promote to TESTED/DONE until encrypted persistence, runtime migration and device/tamper evidence are complete.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0360_RC0371_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0360-rc0371): record storage runtime IMPLEMENTED'
          git push origin HEAD:main
