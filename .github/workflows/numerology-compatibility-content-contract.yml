name: Numerology Compatibility Content Contract

on:
  push:
    paths:
      - 'lib/src/calculation_core/numerology/**'
      - 'lib/src/interpretation/**'
      - 'test/calculation_core/numerology/**'
      - 'test/interpretation/**'
      - 'evidence/numerology/**'
      - 'tools/numerology/**'
      - '.github/workflows/numerology-compatibility-content-contract.yml'
  pull_request:
    paths:
      - 'lib/src/calculation_core/numerology/**'
      - 'lib/src/interpretation/**'
      - 'test/calculation_core/numerology/**'
      - 'test/interpretation/**'
      - 'evidence/numerology/**'
      - 'tools/numerology/**'
      - '.github/workflows/numerology-compatibility-content-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural compatibility content contract
        run: python tools/numerology/validate_compatibility_interpretation.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Compatibility calculation and interpretation tests
        run: >-
          flutter test
          test/calculation_core/numerology/compatibility_test.dart
          test/interpretation/numerology_compatibility_interpretation_test.dart
