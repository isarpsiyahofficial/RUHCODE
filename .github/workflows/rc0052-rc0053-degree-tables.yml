name: RC-0052 RC-0053 Degree Tables

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/western/degree_tables.dart'
      - 'lib/src/calculation_core/western/natal_placements.dart'
      - 'lib/src/calculation_core/western/equal_house_systems.dart'
      - 'test/calculation_core/western/degree_tables_test.dart'
      - 'requirements/contracts/rc0052_rc0053_degree_tables_contract.json'
      - 'tools/requirements/validate_rc0052_rc0053_degree_tables.py'
      - '.github/workflows/rc0052-rc0053-degree-tables.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate exact degree-table contracts
        run: python tools/requirements/validate_rc0052_rc0053_degree_tables.py
      - name: Execute compiled degree-table regressions
        run: flutter test test/calculation_core/western/degree_tables_test.dart
      - name: Promote proven requirements to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0052_rc0053_degree_tables.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8', newline=''))); fields=list(rows[0].keys())
          targets={'RC-0052','RC-0053'}
          links='requirements/contracts/rc0052_rc0053_degree_tables_contract.json|tools/requirements/validate_rc0052_rc0053_degree_tables.py|lib/src/calculation_core/western/degree_tables.dart|lib/src/calculation_core/western/natal_placements.dart|lib/src/calculation_core/western/equal_house_systems.dart|test/calculation_core/western/degree_tables_test.dart|.github/workflows/rc0052-rc0053-degree-tables.yml'
          for r in rows:
            if r['rc_id'] not in targets: continue
            if r['status'] not in ('VERIFIED','DONE'): r['status']='TESTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Product/UI table rendering, TR/EN formatting, accessibility and release evidence remain required before VERIFIED/DONE.'
            r['notes']='Machine gate proves deterministic planet and 12-house degree table models from validated Western calculation snapshots with compiled regressions. TESTED only.'
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0052-rc0053): record degree tables TESTED'
          git push origin HEAD:main
