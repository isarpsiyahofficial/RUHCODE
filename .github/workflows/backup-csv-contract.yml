name: Backup CSV Contract

on:
  push:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/src/backup/**'
      - 'lib/src/data/local/**'
      - 'test/backup/**'
      - 'test/data/**'
      - 'evidence/backup/**'
      - 'tools/backup/**'
      - '.github/workflows/backup-csv-contract.yml'
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/src/backup/**'
      - 'lib/src/data/local/**'
      - 'test/backup/**'
      - 'test/data/**'
      - 'evidence/backup/**'
      - 'tools/backup/**'
      - '.github/workflows/backup-csv-contract.yml'

jobs:
  csv-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CSV structural/evidence contract
        run: python tools/backup/validate_csv_contract.py
      - name: Validate backup table schema contract
        run: python tools/backup/validate_backup_schema_contract.py
      - name: Validate backup package codec contract
        run: python tools/backup/validate_backup_package_contract.py
      - name: Validate portable ZIP backup contract
        run: python tools/backup/validate_portable_zip_contract.py
      - name: Validate portable backup file-store contract
        run: python tools/backup/validate_portable_file_store_contract.py
      - name: Validate native backup document/share gateway contract
        run: python tools/backup/validate_backup_platform_gateway_contract.py
      - name: Validate LocalDatabase export contract
        run: python tools/backup/validate_local_export_contract.py
      - name: Validate transactional backup import contract
        run: python tools/backup/validate_backup_import_contract.py
      - name: Validate production SQLite backup-store contract
        run: python tools/backup/validate_backup_production_store_contract.py
      - name: Validate full portable SQLite backup lifecycle contract
        run: python tools/backup/validate_full_lifecycle_contract.py
      - name: Validate legacy v0 migration contract
        run: python tools/backup/validate_legacy_v0_migration_contract.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run backup codec schema package import ZIP platform-gateway file-store export lifecycle legacy-migration and production-store tests
        run: flutter test test/backup test/data