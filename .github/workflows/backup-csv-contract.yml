name: Backup CSV Contract

on:
  push:
    paths:
      - 'lib/src/backup/**'
      - 'test/backup/**'
      - 'evidence/backup/**'
      - 'tools/backup/**'
      - '.github/workflows/backup-csv-contract.yml'
  pull_request:
    paths:
      - 'lib/src/backup/**'
      - 'test/backup/**'
      - 'evidence/backup/**'
      - 'tools/backup/**'
      - '.github/workflows/backup-csv-contract.yml'

jobs:
  csv-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CSV structural/evidence contract
        run: python tools/backup/validate_csv_contract.py
      - name: Validate backup table schema contract
        run: python tools/backup/validate_backup_schema_contract.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run backup codec and schema tests
        run: flutter test test/backup
