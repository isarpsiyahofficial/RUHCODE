name: Backup CSV Contract

on:
  push:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/main.dart'
      - 'lib/src/app/**'
      - 'lib/src/backup/**'
      - 'lib/src/data/local/**'
      - 'lib/src/ui/actions/**'
      - 'lib/src/ui/navigation/**'
      - 'lib/src/ui/backup/**'
      - 'test/backup/**'
      - 'test/data/**'
      - 'test/ui/backup/**'
      - 'evidence/backup/**'
      - 'evidence/ui/backup_restore_preview_accessibility_contract.json'
      - 'tools/backup/**'
      - 'ui/action_registry.csv'
      - 'ui/action_registry_runtime_extensions.csv'
      - 'ui/runtime_action_bindings.csv'
      - '.github/workflows/backup-csv-contract.yml'
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/main.dart'
      - 'lib/src/app/**'
      - 'lib/src/backup/**'
      - 'lib/src/data/local/**'
      - 'lib/src/ui/actions/**'
      - 'lib/src/ui/navigation/**'
      - 'lib/src/ui/backup/**'
      - 'test/backup/**'
      - 'test/data/**'
      - 'test/ui/backup/**'
      - 'evidence/backup/**'
      - 'evidence/ui/backup_restore_preview_accessibility_contract.json'
      - 'tools/backup/**'
      - 'ui/action_registry.csv'
      - 'ui/action_registry_runtime_extensions.csv'
      - 'ui/runtime_action_bindings.csv'
      - '.github/workflows/backup-csv-contract.yml'

jobs:
  csv-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CSV structural/evidence contract
        run: python tools/backup/validate_csv_contract.py
      - name: Validate backup table schema contract
        run: python tools/backup/validate_backup_schema_contract.py
      - name: Validate backup package codec contract
        run: python tools/backup/validate_backup_package_contract.py
      - name: Validate portable ZIP backup contract
        run: python tools/backup/validate_portable_zip_contract.py
      - name: Validate portable backup file-store contract
        run: python tools/backup/validate_portable_file_store_contract.py
      - name: Validate native backup document/share gateway contract
        run: python tools/backup/validate_backup_platform_gateway_contract.py
      - name: Validate backup application-service contract
        run: python tools/backup/validate_backup_application_service_contract.py
      - name: Validate backup UI action/state contract
        run: python tools/backup/validate_backup_ui_contract.py
      - name: Validate backup restore preview accessibility/action contract
        run: python tools/backup/validate_backup_restore_preview_accessibility.py
      - name: Validate production runtime backup wiring
        run: python tools/backup/validate_runtime_backup_wiring.py
      - name: Validate LocalDatabase export contract
        run: python tools/backup/validate_local_export_contract.py
      - name: Validate single-table CSV export contract
        run: python tools/backup/validate_single_table_csv_export.py
      - name: Validate transactional backup import contract
        run: python tools/backup/validate_backup_import_contract.py
      - name: Validate production SQLite backup-store contract
        run: python tools/backup/validate_backup_production_store_contract.py
      - name: Validate full portable SQLite backup lifecycle contract
        run: python tools/backup/validate_full_lifecycle_contract.py
      - name: Validate legacy v0 migration contract
        run: python tools/backup/validate_legacy_v0_migration_contract.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run backup and backup-UI contract tests
        run: flutter test test/backup test/data test/ui/backup
