name: RC-0154 through RC-0157 BaZi Professional Cycles

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation_core/bazi/bazi_professional_cycles.dart'
      - 'lib/src/calculation_core/bazi/bazi_derived_analysis.dart'
      - 'lib/src/calculation_core/bazi/bazi_four_pillars.dart'
      - 'lib/src/calculation_core/bazi/sexagenary_cycle.dart'
      - 'test/calculation_core/bazi_professional_cycles_test.dart'
      - 'requirements/contracts/rc0154_rc0157_bazi_professional_cycles_contract.json'
      - 'tools/requirements/validate_rc0154_rc0157_bazi_professional_cycles.py'
      - '.github/workflows/rc0154-rc0157-bazi-professional-cycles.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0154-rc0157
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0154_rc0157_bazi_professional_cycles.py
      - run: flutter test test/calculation_core/bazi_professional_cycles_test.dart
      - name: Promote RC-0154 through RC-0157 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0154_rc0157_bazi_professional_cycles.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8', newline='') as f:
            rows = list(csv.DictReader(f))
          fields = list(rows[0].keys())
          targets = {f'RC-{i:04d}' for i in range(154, 158)}
          links = 'requirements/contracts/rc0154_rc0157_bazi_professional_cycles_contract.json|tools/requirements/validate_rc0154_rc0157_bazi_professional_cycles.py|lib/src/calculation_core/bazi/bazi_professional_cycles.dart|test/calculation_core/bazi_professional_cycles_test.dart|.github/workflows/rc0154-rc0157-bazi-professional-cycles.yml'
          found = set()
          for r in rows:
            if r['rc_id'] not in targets:
              continue
            found.add(r['rc_id'])
            if r['status'] not in ('VERIFIED', 'DONE'):
              r['status'] = 'TESTED'
            r['evidence_links'] = links
            r['blocked'] = 'YES'
            r['blocker'] = 'Authoritative seasonal element-strength methodology, Da Yun direction/start-age convention provider, annual/monthly solar-term calendar provider, independent golden vectors, rendered TR/EN interpretation, Free/PRO, offline/device and release evidence remain required.'
            r['notes'] = 'Machine gate proves explicit element-balance methodology, deterministic Da Yun sequence/ranges after versioned convention resolution, and separate annual/monthly Gan-Zhi period influence with Day-Master relationship. Convention-sensitive providers remain fail-closed; TESTED only.'
          missing = targets - found
          if missing:
            raise SystemExit(f'RC0154_RC0157_FAIL: missing matrix rows: {sorted(missing)}')
          with p.open('w', encoding='utf-8', newline='') as f:
            w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
            w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0154-rc0157): record BaZi professional cycles TESTED'
          git push origin HEAD:main
