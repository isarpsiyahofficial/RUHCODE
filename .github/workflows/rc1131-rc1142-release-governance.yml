name: RC-1131 to RC-1142 Release Governance

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'

permissions:
  contents: read

jobs:
  governance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RC-1131 through RC-1142 governance contract
        run: python3 tool/validate_release_governance.py
