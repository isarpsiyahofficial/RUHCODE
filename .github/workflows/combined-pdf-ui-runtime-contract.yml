name: Combined PDF UI Runtime Contract

on:
  push:
    paths:
      - 'lib/src/pdf/**'
      - 'lib/src/ui/pdf/**'
      - 'lib/src/app/app_runtime.dart'
      - 'lib/main.dart'
      - 'test/ui/pdf/combined_pdf_selection_state_test.dart'
      - 'evidence/pdf/persisted_combined_projection.json'
      - 'tools/pdf/validate_combined_pdf_ui_runtime.py'
      - '.github/workflows/combined-pdf-ui-runtime-contract.yml'
  pull_request:
    paths:
      - 'lib/src/pdf/**'
      - 'lib/src/ui/pdf/**'
      - 'lib/src/app/app_runtime.dart'
      - 'lib/main.dart'
      - 'test/ui/pdf/combined_pdf_selection_state_test.dart'
      - 'evidence/pdf/persisted_combined_projection.json'
      - 'tools/pdf/validate_combined_pdf_ui_runtime.py'
      - '.github/workflows/combined-pdf-ui-runtime-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python tools/pdf/validate_persisted_combined_projection.py
      - run: python tools/pdf/validate_combined_pdf_ui_runtime.py
      - run: flutter pub get
      - run: flutter test test/ui/pdf/combined_pdf_selection_state_test.dart
