name: RC-0013 Common Astronomy Core

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/calculation_core/ephemeris/**'
      - 'test/calculation_core/ephemeris_contract_test.dart'
      - 'test/calculation_core/de440s_asset_loader_test.dart'
      - 'test/calculation_core/de440s_daf_parser_test.dart'
      - 'test/calculation_core/de440s_type2_runtime_test.dart'
      - 'test/calculation_core/de440s_body_graph_runtime_test.dart'
      - 'test/calculation_core/de440s_jpl_horizons_accuracy_test.dart'
      - 'requirements/contracts/rc0013_common_astronomy_core_contract.json'
      - 'tools/requirements/validate_rc0013_common_astronomy_core.py'
      - '.github/workflows/rc0013-common-astronomy-core.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate RC-0013 binding and physical common core
        run: python tools/requirements/validate_rc0013_common_astronomy_core.py
      - name: Run common ephemeris contract regressions
        run: flutter test test/calculation_core/ephemeris_contract_test.dart test/calculation_core/de440s_asset_loader_test.dart test/calculation_core/de440s_daf_parser_test.dart test/calculation_core/de440s_type2_runtime_test.dart test/calculation_core/de440s_body_graph_runtime_test.dart test/calculation_core/de440s_jpl_horizons_accuracy_test.dart
      - name: Promote RC-0013 to TESTED
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0013_common_astronomy_core.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8', newline='')))
          fields=rows[0].keys()
          target=next((r for r in rows if r['rc_id']=='RC-0013'), None)
          if target is None:
              raise SystemExit('missing RC-0013')
          if target['status'] not in ('VERIFIED','DONE'):
              target['status']='TESTED'
          target['evidence_links']='requirements/contracts/rc0013_common_astronomy_core_contract.json|tools/requirements/validate_rc0013_common_astronomy_core.py|lib/src/calculation_core/ephemeris/ephemeris.dart|lib/src/calculation_core/ephemeris/de440s_asset_loader.dart|lib/src/calculation_core/ephemeris/de440s_daf_parser.dart|lib/src/calculation_core/ephemeris/spk_type2_evaluator.dart|lib/src/calculation_core/ephemeris/spk_body_graph_evaluator.dart|test/calculation_core/ephemeris_contract_test.dart|test/calculation_core/de440s_asset_loader_test.dart|test/calculation_core/de440s_daf_parser_test.dart|test/calculation_core/de440s_type2_runtime_test.dart|test/calculation_core/de440s_body_graph_runtime_test.dart|test/calculation_core/de440s_jpl_horizons_accuracy_test.dart|.github/workflows/rc0013-common-astronomy-core.yml'
          target['notes']='Dedicated machine gate proves a shared versioned offline ephemeris core is executable through packaged DE440s DAF/SPK parsing, Type-2 evaluation and body-graph evaluation, with compiled contract and JPL Horizons accuracy regression. This proves RC-0013 to TESTED only.'
          target['blocked']='YES'
          target['blocker']='RC-0014→RC-0016 and broader astronomy golden/tolerance coverage must prove the shared core across required bodies, lunar nodes and motion-state outputs before VERIFIED/DONE.'
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0013): record common astronomy core TESTED'
          git push origin HEAD:main
