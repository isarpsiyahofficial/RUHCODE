name: UI Contracts
on:
  push:
    branches: [main]
    paths: ['docs/UI_REFERENCE_CONTRACT.md','ui/**','tools/ui/validate_ui_contracts.py','.github/workflows/ui-contracts.yml']
  pull_request:
    paths: ['docs/UI_REFERENCE_CONTRACT.md','ui/**','tools/ui/validate_ui_contracts.py','.github/workflows/ui-contracts.yml']
  workflow_dispatch:
jobs:
  validate-ui-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ui/validate_ui_contracts.py
