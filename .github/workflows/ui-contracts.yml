name: UI Contracts
on:
  push:
    branches: [main]
    paths: ['docs/UI_REFERENCE_CONTRACT.md','docs/DYNAMIC_GEOMETRY_CONTRACT.md','docs/STATIC_ASSET_CONTRACT.md','docs/DESIGN_SYSTEM_CONTRACT.md','ui/**','tools/ui/**','.github/workflows/ui-contracts.yml']
  pull_request:
    paths: ['docs/UI_REFERENCE_CONTRACT.md','docs/DYNAMIC_GEOMETRY_CONTRACT.md','docs/STATIC_ASSET_CONTRACT.md','docs/DESIGN_SYSTEM_CONTRACT.md','ui/**','tools/ui/**','.github/workflows/ui-contracts.yml']
  workflow_dispatch:
jobs:
  validate-ui-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate UI contracts
        run: python tools/ui/validate_ui_contracts.py
      - name: Validate accessibility and interaction contracts
        run: python tools/ui/validate_accessibility_interactions.py
      - name: Validate portable backup action wording
        run: python tools/ui/validate_backup_action_labels.py
      - name: Validate static asset contracts
        run: python tools/ui/validate_static_assets.py
      - name: Validate design tokens
        run: python tools/ui/validate_design_tokens.py
      - name: Build action coverage report
        run: python tools/ui/report_action_coverage.py
      - name: Upload action coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ui-action-coverage
          path: build/ui-action-coverage.csv
          if-no-files-found: error
