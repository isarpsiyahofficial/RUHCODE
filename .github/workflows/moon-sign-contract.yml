name: Moon Sign Contract

on:
  push:
    paths:
      - 'lib/src/calculation_core/lunar/moon_sign.dart'
      - 'lib/src/calculation_core/daily/moon_sign_factor.dart'
      - 'test/calculation_core/moon_sign_test.dart'
      - 'requirements/reference_manifests/moon_sign_runtime.json'
      - 'tools/astronomy/validate_moon_sign_contract.py'
      - '.github/workflows/moon-sign-contract.yml'
  pull_request:
    paths:
      - 'lib/src/calculation_core/lunar/moon_sign.dart'
      - 'lib/src/calculation_core/daily/moon_sign_factor.dart'
      - 'test/calculation_core/moon_sign_test.dart'
      - 'requirements/reference_manifests/moon_sign_runtime.json'
      - 'tools/astronomy/validate_moon_sign_contract.py'

jobs:
  moon-sign-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: python tools/astronomy/validate_moon_sign_contract.py
      - run: flutter test test/calculation_core/moon_sign_test.dart
