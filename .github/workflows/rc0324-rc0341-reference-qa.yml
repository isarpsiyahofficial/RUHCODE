name: RC-0324 through RC-0341 Reference QA

on:
  push:
    branches: [main]
    paths:
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - 'lib/src/calculation/reference_qa.dart'
      - 'test/calculation/reference_qa_rc0324_rc0341_test.dart'
      - 'requirements/contracts/rc0324_rc0341_reference_qa_contract.json'
      - 'tools/requirements/validate_rc0324_rc0341_reference_qa.py'
      - '.github/workflows/rc0324-rc0341-reference-qa.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0324-rc0341
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0324_rc0341_reference_qa.py
      - run: flutter test test/calculation/reference_qa_rc0324_rc0341_test.dart
      - name: Record RC-0324 through RC-0341 implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0324_rc0341_reference_qa.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys())
          targets={f'RC-{i:04d}' for i in range(324,342)}
          links='requirements/contracts/rc0324_rc0341_reference_qa_contract.json|tools/requirements/validate_rc0324_rc0341_reference_qa.py|lib/src/calculation/reference_qa.dart|test/calculation/reference_qa_rc0324_rc0341_test.dart|.github/workflows/rc0324-rc0341-reference-qa.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status'] == 'NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links
            r['blocked']='YES'
            r['blocker']='Real independent golden corpora are not yet populated: Western and Vedic each require >=1000 date/location/timezone cases; planetary-hours require global coordinate/timezone coverage; BaZi/numerology and all boundary classes require authoritative expectations. Exact AKILES provenance remains binding where applicable.'
            r['notes']='Reference QA harness, provenance enforcement, boundary taxonomy and fail-closed release policy are implemented and regression-tested. This workflow intentionally does NOT promote these requirements to TESTED because the binding production-scale golden/reference corpus is still missing.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0324_RC0341_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0324-rc0341): record reference QA IMPLEMENTED'
          git push origin HEAD:main
