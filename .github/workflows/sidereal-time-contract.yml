name: Sidereal Time Contract

on:
  push:
  pull_request:

jobs:
  sidereal-time-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sidereal time reference contract
        run: python tools/time/validate_sidereal_time_contract.py
