name: RC0870-RC0877 PDF Vector Rendering

on:
  push:
    branches: [main]
    paths:
      - 'lib/src/pdf/pdf_vector_rendering.dart'
      - 'lib/src/pdf/pdf_vector_widget.dart'
      - 'lib/src/pdf/pdf_local_renderer.dart'
      - 'lib/src/pdf/pdf_table_layout.dart'
      - 'test/pdf/pdf_vector_rendering_rc0870_rc0877_test.dart'
      - 'requirements/contracts/rc0870_rc0877_pdf_vector_rendering_contract.json'
      - 'tools/requirements/validate_rc0870_rc0877_pdf_vector_rendering.py'
      - 'RUH_CODE_MASTER_SARTNAME.md'
      - '.github/workflows/rc0870-rc0877-pdf-vector-rendering.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requirement-matrix-writers-rc0870-rc0877
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.44.7', channel: stable, cache: true}
      - run: flutter pub get
      - run: python tools/requirements/validate_rc0870_rc0877_pdf_vector_rendering.py
      - run: flutter test test/pdf/pdf_vector_rendering_rc0870_rc0877_test.dart
      - name: Record implementation evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python tools/requirements/validate_rc0870_rc0877_pdf_vector_rendering.py
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('requirements/requirement_state.csv')
          with p.open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); targets={f'RC-{i:04d}' for i in range(870,878)}
          links='requirements/contracts/rc0870_rc0877_pdf_vector_rendering_contract.json|tools/requirements/validate_rc0870_rc0877_pdf_vector_rendering.py|lib/src/pdf/pdf_vector_rendering.dart|lib/src/pdf/pdf_vector_widget.dart|lib/src/pdf/pdf_local_renderer.dart|lib/src/pdf/pdf_table_layout.dart|test/pdf/pdf_vector_rendering_rc0870_rc0877_test.dart|.github/workflows/rc0870-rc0877-pdf-vector-rendering.yml'
          found=set()
          for r in rows:
            if r['rc_id'] not in targets: continue
            found.add(r['rc_id'])
            if r['status']=='NOT_STARTED': r['status']='IMPLEMENTED'
            r['evidence_links']=links; r['blocked']='YES'
            r['blocker']='Rendered TR/EN golden PDF visual verification, production chart projection, zoom/print inspection and exact-release artifact evidence remain open.'
            r['notes']='Western and Vedic charts now have SVG vector primitives bound to package:pdf SvgImage; raster chart payloads fail closed; numerology/BaZi use aligned real PDF table data.'
          missing=targets-found
          if missing: raise SystemExit(f'RC0870_RC0877_FAIL: missing rows {sorted(missing)}')
          with p.open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/requirements/validate_requirement_matrix.py
          if git diff --quiet -- requirements/requirement_state.csv; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/requirement_state.csv
          git commit -m 'requirements(rc0870-rc0877): record vector PDF IMPLEMENTED'
          git push origin HEAD:main
