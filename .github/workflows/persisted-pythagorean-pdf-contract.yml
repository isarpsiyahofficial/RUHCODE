name: Persisted Pythagorean PDF Contract

on:
  push:
    paths:
      - 'lib/src/pdf/persisted_pythagorean_numerology_pdf.dart'
      - 'lib/src/pdf/persisted_calculation_pdf_router.dart'
      - 'lib/src/pdf/persisted_calculation_pdf_source.dart'
      - 'test/pdf/persisted_pythagorean_numerology_pdf_test.dart'
      - 'test/pdf/persisted_calculation_pdf_router_test.dart'
      - 'evidence/pdf/persisted_pythagorean_pdf.json'
      - 'tools/pdf/validate_persisted_pythagorean_pdf.py'
      - '.github/workflows/persisted-pythagorean-pdf-contract.yml'
  pull_request:
    paths:
      - 'lib/src/pdf/persisted_pythagorean_numerology_pdf.dart'
      - 'lib/src/pdf/persisted_calculation_pdf_router.dart'
      - 'lib/src/pdf/persisted_calculation_pdf_source.dart'
      - 'test/pdf/persisted_pythagorean_numerology_pdf_test.dart'
      - 'test/pdf/persisted_calculation_pdf_router_test.dart'
      - 'evidence/pdf/persisted_pythagorean_pdf.json'
      - 'tools/pdf/validate_persisted_pythagorean_pdf.py'
      - '.github/workflows/persisted-pythagorean-pdf-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural contract
        run: python tools/pdf/validate_persisted_pythagorean_pdf.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Persisted Pythagorean PDF tests
        run: >-
          flutter test
          test/pdf/persisted_pythagorean_numerology_pdf_test.dart
          test/pdf/persisted_calculation_pdf_router_test.dart
