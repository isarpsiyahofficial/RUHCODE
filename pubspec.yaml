name: ruh_code
description: Offline-first Ruh Code astrology, numerology and professional consultation application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.9
  crypto: ^3.0.7
  file_picker: ^12.0.0
  flutter_timezone: ^5.1.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  path: ^1.9.1
  pdf: ^3.13.0
  share_plus: ^13.3.0
  sqflite: ^2.4.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/daily_messages/tr/
    - assets/content/daily_messages/en/
    - assets/data/cities/
    - assets/data/eop/
    - assets/data/ephemeris/
